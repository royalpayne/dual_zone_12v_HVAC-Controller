<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="700" height="480" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="350" y="30" fill="#e0e0e0" font-size="16" text-anchor="middle" font-weight="bold">Fan Speed Relay Wiring — Pull-Up Resistors</text>
  <text x="350" y="50" fill="#888" font-size="11" text-anchor="middle">ESP32-S3 → 10K Pull-ups → Relay Module (Active HIGH, 5V VCC)</text>

  <!-- ESP32 Box -->
  <rect x="30" y="80" width="140" height="250" fill="#16213e" stroke="#4cc9f0" stroke-width="2" rx="6"/>
  <text x="100" y="105" fill="#4cc9f0" font-size="14" text-anchor="middle" font-weight="bold">ESP32-S3</text>

  <!-- ESP32 pins -->
  <text x="50" y="155" fill="#90be6d" font-size="12">GPIO 40</text>
  <text x="50" y="225" fill="#90be6d" font-size="12">GPIO 42</text>
  <text x="50" y="285" fill="#f94144" font-size="12">GND</text>
  <text x="50" y="305" fill="#f9c74f" font-size="12">3.3V</text>

  <!-- Relay Module Box -->
  <rect x="500" y="80" width="170" height="250" fill="#16213e" stroke="#43a047" stroke-width="2" rx="6"/>
  <text x="585" y="105" fill="#43a047" font-size="14" text-anchor="middle" font-weight="bold">Relay Module</text>
  <text x="585" y="120" fill="#888" font-size="10" text-anchor="middle">Active HIGH, 5V VCC</text>
  <text x="585" y="133" fill="#888" font-size="10" text-anchor="middle">Jumper = HIGH trigger</text>

  <!-- Relay module pins -->
  <text x="515" y="165" fill="#90be6d" font-size="12">IN1 (Fan Low)</text>
  <text x="515" y="225" fill="#90be6d" font-size="12">IN2 (Fan High)</text>
  <text x="515" y="285" fill="#f94144" font-size="12">GND</text>
  <text x="515" y="305" fill="#f9c74f" font-size="12">VCC (5V)</text>

  <!-- 3.3V bus line -->
  <line x1="170" y1="301" x2="170" y2="390" stroke="#f9c74f" stroke-width="2"/>
  <line x1="170" y1="390" x2="430" y2="390" stroke="#f9c74f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="300" y="385" fill="#f9c74f" font-size="10" text-anchor="middle">3.3V rail</text>

  <!-- GPIO 40 line -->
  <line x1="170" y1="151" x2="500" y2="161" stroke="#90be6d" stroke-width="2"/>
  <!-- Pull-up junction dot -->
  <circle cx="340" cy="156" r="4" fill="#90be6d"/>
  <!-- Pull-up resistor to 3.3V -->
  <line x1="340" y1="156" x2="340" y2="175" stroke="#f9c74f" stroke-width="1.5"/>
  <rect x="332" y="175" width="16" height="40" fill="none" stroke="#f9c74f" stroke-width="1.5" rx="2"/>
  <text x="355" y="200" fill="#f9c74f" font-size="10">10K</text>
  <line x1="340" y1="215" x2="340" y2="390" stroke="#f9c74f" stroke-width="1.5"/>
  <circle cx="340" cy="390" r="3" fill="#f9c74f"/>

  <!-- GPIO 42 line -->
  <line x1="170" y1="221" x2="500" y2="221" stroke="#90be6d" stroke-width="2"/>
  <!-- Pull-up junction dot -->
  <circle cx="420" cy="221" r="4" fill="#90be6d"/>
  <!-- Pull-up resistor to 3.3V -->
  <line x1="420" y1="221" x2="420" y2="240" stroke="#f9c74f" stroke-width="1.5"/>
  <rect x="412" y="240" width="16" height="40" fill="none" stroke="#f9c74f" stroke-width="1.5" rx="2"/>
  <text x="435" y="265" fill="#f9c74f" font-size="10">10K</text>
  <line x1="420" y1="280" x2="420" y2="390" stroke="#f9c74f" stroke-width="1.5"/>
  <circle cx="420" cy="390" r="3" fill="#f9c74f"/>

  <!-- GND line -->
  <line x1="170" y1="281" x2="500" y2="281" stroke="#f94144" stroke-width="2"/>

  <!-- Legend -->
  <rect x="30" y="410" width="640" height="60" fill="#0f0f23" stroke="#333" stroke-width="1" rx="4"/>
  <text x="50" y="432" fill="#e0e0e0" font-size="11" font-weight="bold">Key:</text>
  <line x1="90" y1="429" x2="120" y2="429" stroke="#90be6d" stroke-width="2"/>
  <text x="125" y="432" fill="#90be6d" font-size="11">Signal (GPIO→IN)</text>
  <line x1="260" y1="429" x2="290" y2="429" stroke="#f9c74f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="295" y="432" fill="#f9c74f" font-size="11">3.3V pull-up</text>
  <line x1="410" y1="429" x2="440" y2="429" stroke="#f94144" stroke-width="2"/>
  <text x="445" y="432" fill="#f94144" font-size="11">GND (shared)</text>
  <circle cx="570" cy="429" r="4" fill="#90be6d"/>
  <text x="580" y="432" fill="#e0e0e0" font-size="11">Junction</text>
  <text x="50" y="455" fill="#888" font-size="10">Pull-ups (10K to 3.3V) prevent boot-time relay activation. boot.py drives GPIOs LOW immediately on startup.</text>
  <text x="50" y="467" fill="#888" font-size="10">GPIO 41 (Medium) removed — only Low + High to fit 5-wire thermostat cable.</text>
</svg>
