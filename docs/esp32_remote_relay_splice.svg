<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850">
  <style>
    .title { font: bold 18px sans-serif; fill: #eee; }
    .subtitle { font: 13px sans-serif; fill: #888; }
    .label { font: 12px sans-serif; fill: #ccc; }
    .pin { font: bold 11px monospace; }
    .component { font: bold 13px sans-serif; }
    .note { font: italic 11px sans-serif; fill: #888; }
    .small { font: 10px sans-serif; fill: #999; }
    .tbl-header { font: bold 11px sans-serif; fill: #eee; }
    .tbl-cell { font: 11px monospace; fill: #ccc; }
    .wire-line { stroke: #ff6f00; stroke-width: 2.5; fill: none; }
    .wire-neutral { stroke: #fff; stroke-width: 2.5; fill: none; }
    .wire-comp { stroke: #42a5f5; stroke-width: 2.5; fill: none; }
    .wire-fanhi { stroke: #333; stroke-width: 2.5; fill: none; }
    .wire-fanlo { stroke: #ef5350; stroke-width: 2.5; fill: none; }
    .wire-furnace { stroke: #8d6e63; stroke-width: 2.5; fill: none; }
    .wire-ground { stroke: #66bb6a; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
    .wire-12v { stroke: #00e676; stroke-width: 2; fill: none; }
    .wire-12vgnd { stroke: #333; stroke-width: 2; fill: none; stroke-dasharray: 4,3; }
    .wire-sensor { stroke: #ab47bc; stroke-width: 2; fill: none; }
    .wire-thermal { stroke: #ff7043; stroke-width: 2; fill: none; stroke-dasharray: 8,3; }
    .term { font: bold 10px monospace; }
  </style>

  <!-- Background -->
  <rect width="1080" height="850" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="540" y="30" text-anchor="middle" class="title">ESP32 Remote — Direct 120VAC Wiring to Dometic Brisk II</text>
  <text x="540" y="48" text-anchor="middle" class="subtitle">SSR-25DA for compressor | HL-52S for fans + furnace | DS18B20 freeze sensor + bimetal cutout</text>

  <!-- ==================== POWER SOURCES (Top) ==================== -->
  <!-- 120VAC Shore Power -->
  <rect x="30" y="70" width="170" height="70" rx="8" fill="#2a1a00" stroke="#ff6f00" stroke-width="2"/>
  <text x="115" y="95" text-anchor="middle" class="component" fill="#ff6f00">Shore Power</text>
  <text x="115" y="112" text-anchor="middle" class="small">120VAC / 15A breaker</text>
  <text x="115" y="128" text-anchor="middle" class="small">14 AWG minimum</text>
  <circle cx="200" cy="90" r="5" fill="#ff6f00"/>
  <text x="210" y="85" class="pin" fill="#ff6f00">LINE</text>
  <circle cx="200" cy="120" r="5" fill="#fff"/>
  <text x="210" y="115" class="pin" fill="#fff">NEU</text>

  <!-- 12VDC RV Battery -->
  <rect x="30" y="530" width="170" height="55" rx="8" fill="#1a0a0a" stroke="#00e676" stroke-width="2"/>
  <text x="115" y="553" text-anchor="middle" class="component" fill="#00e676">RV 12VDC</text>
  <text x="115" y="572" text-anchor="middle" class="small">House battery / converter</text>
  <circle cx="200" cy="545" r="5" fill="#00e676"/>
  <text x="210" y="541" class="pin" fill="#00e676">+12V</text>
  <circle cx="200" cy="570" r="5" fill="#666"/>
  <text x="210" y="566" class="pin" fill="#888">GND</text>

  <!-- ==================== ESP32 + RELAY MODULE (Left) ==================== -->
  <rect x="30" y="160" width="280" height="350" rx="8" fill="#16213e" stroke="#4cc9f0" stroke-width="2"/>
  <text x="170" y="183" text-anchor="middle" class="component" fill="#4cc9f0">ESP32-S3 Remote</text>
  <text x="170" y="199" text-anchor="middle" class="small">192.168.71.153</text>

  <!-- Relay module sub-box -->
  <rect x="45" y="210" width="250" height="285" rx="4" fill="#0f1a30" stroke="#2196f3" stroke-width="1"/>
  <text x="170" y="228" text-anchor="middle" class="label" fill="#64b5f6">HL-52S 4-Channel Relay Module</text>
  <text x="170" y="242" text-anchor="middle" class="small">Active HIGH | 5V VCC | 10A @ 250VAC contacts</text>

  <!-- 120VAC COM bus label (Fans only) -->
  <text x="80" y="260" class="small" fill="#ff6f00">120VAC LINE bus (Relays 3-4 only)</text>

  <!-- Vertical 120VAC bus line (fans only — stops before relay 2) -->
  <line x1="70" y1="268" x2="70" y2="420" stroke="#ff6f00" stroke-width="2"/>

  <!-- Relay 2: Compressor SSR trigger (12VDC, NOT on 120VAC bus) -->
  <rect x="55" y="270" width="230" height="42" rx="3" fill="#1a1a2a" stroke="#42a5f5" stroke-width="1.2"/>
  <text x="85" y="284" class="pin" fill="#42a5f5">GPIO 39</text>
  <text x="148" y="284" class="label" fill="#90caf9">Relay 2: SSR TRIGGER</text>
  <text x="170" y="304" text-anchor="middle" class="small" fill="#00e676">12VDC (not on 120V bus)</text>
  <circle cx="278" cy="285" r="4" fill="#00e676"/>
  <text x="268" y="265" text-anchor="middle" class="small">NO</text>

  <!-- Relay 3: Fan Low (120VAC) -->
  <rect x="55" y="320" width="230" height="42" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="1.2"/>
  <circle cx="70" cy="340" r="4" fill="#ff6f00"/>
  <text x="85" y="334" class="pin" fill="#ef5350">GPIO 40</text>
  <text x="150" y="334" class="label" fill="#ef9a9a">Relay 3: FAN LOW</text>
  <text x="150" y="354" class="small" fill="#ff6f00">120VAC</text>
  <circle cx="278" cy="335" r="4" fill="#ef5350"/>
  <text x="268" y="358" text-anchor="middle" class="small">NO</text>

  <!-- Relay 4: Fan High (120VAC) -->
  <rect x="55" y="370" width="230" height="42" rx="3" fill="#1a1a1a" stroke="#555" stroke-width="1.2"/>
  <circle cx="70" cy="390" r="4" fill="#ff6f00"/>
  <text x="85" y="384" class="pin" fill="#aaa">GPIO 41</text>
  <text x="150" y="384" class="label" fill="#bbb">Relay 4: FAN HIGH</text>
  <text x="150" y="404" class="small" fill="#ff6f00">120VAC</text>
  <circle cx="278" cy="385" r="4" fill="#555"/>
  <text x="268" y="408" text-anchor="middle" class="small">NO</text>

  <!-- Relay 1: Furnace (separate dry contact) -->
  <rect x="55" y="450" width="230" height="35" rx="3" fill="#2a1a1a" stroke="#8d6e63" stroke-width="1.2"/>
  <text x="65" y="470" class="pin" fill="#8d6e63">GPIO 38</text>
  <text x="140" y="470" class="label" fill="#bcaaa4">Relay 1: FURNACE</text>
  <text x="260" y="470" class="small" fill="#8d6e63">Dry Contact</text>

  <!-- 120VAC LINE wire from shore power splits to: fan relay bus + SSR -->
  <!-- LINE to fan relay COM bus -->
  <path d="M200 90 L260 90 L260 268 L70 268" class="wire-line"/>
  <!-- LINE branch to SSR AC input -->
  <path d="M260 90 L260 70 L420 70 L420 185" class="wire-line"/>
  <circle cx="260" cy="90" r="3" fill="#ff6f00"/>

  <!-- 12VDC wire to Relay 2 COM -->
  <path d="M200 545 L230 545 L230 290 L55 290" class="wire-12v"/>
  <!-- Label on Relay 2 COM side -->
  <circle cx="55" cy="290" r="4" fill="#00e676"/>
  <text x="55" y="310" text-anchor="middle" class="small" fill="#00e676">COM</text>

  <!-- 12VDC GND wire to SSR DC- -->
  <path d="M200 570 L245 570 L245 230 L400 230" class="wire-12vgnd"/>

  <!-- ==================== SSR-25DA (Center) ==================== -->
  <rect x="370" y="155" width="200" height="100" rx="8" fill="#0a1a0a" stroke="#4caf50" stroke-width="2.5"/>
  <text x="470" y="178" text-anchor="middle" class="component" fill="#4caf50">SSR-25DA</text>
  <text x="470" y="193" text-anchor="middle" class="small" fill="#81c784">Twtade Solid State Relay</text>
  <text x="470" y="206" text-anchor="middle" class="small" fill="#81c784">25A / 24-380VAC / 3-32VDC input</text>

  <!-- SSR DC input terminals (left side) -->
  <circle cx="400" cy="220" r="5" fill="#00e676" stroke="#00c853" stroke-width="1"/>
  <text x="408" y="240" class="term" fill="#00e676">DC+</text>
  <circle cx="440" cy="220" r="5" fill="#666" stroke="#444" stroke-width="1"/>
  <text x="448" y="240" class="term" fill="#888">DC-</text>

  <!-- SSR AC output terminals (right side) -->
  <circle cx="500" cy="220" r="5" fill="#ff6f00" stroke="#e65100" stroke-width="1"/>
  <text x="492" y="240" class="term" fill="#ff6f00">AC1</text>
  <circle cx="540" cy="220" r="5" fill="#42a5f5" stroke="#1565c0" stroke-width="1"/>
  <text x="535" y="240" class="term" fill="#42a5f5">AC2</text>

  <!-- Heatsink note -->
  <text x="470" y="248" text-anchor="middle" class="small" fill="#ffeb3b">MOUNT ON HEATSINK (~15W @ 12A)</text>

  <!-- Wire: Relay 2 NO → SSR DC+ -->
  <path d="M282 285 L340 285 L340 220 L395 220" class="wire-12v"/>

  <!-- Wire: 12VDC GND → SSR DC- (already drawn above) -->

  <!-- Wire: 120VAC LINE → SSR AC1 -->
  <path d="M420 185 L420 220 L495 220" class="wire-line"/>
  <text x="420" y="175" text-anchor="middle" class="small" fill="#ff6f00">LINE in</text>

  <!-- ==================== BIMETAL THERMAL CUTOUT ==================== -->
  <rect x="610" y="190" width="130" height="55" rx="6" fill="#1a0f0f" stroke="#ff7043" stroke-width="2"/>
  <text x="675" y="210" text-anchor="middle" class="component" fill="#ff7043">Bimetal Cutout</text>
  <text x="675" y="226" text-anchor="middle" class="small" fill="#ffab91">NC, opens ~32F</text>
  <text x="675" y="238" text-anchor="middle" class="small" fill="#ffab91">Hardware backup</text>

  <!-- Wire: SSR AC2 → Bimetal cutout input -->
  <path d="M545 220 L610 220" class="wire-comp"/>
  <text x="577" y="213" text-anchor="middle" class="small" fill="#42a5f5">AC2 out</text>

  <!-- Wire: Bimetal cutout output → Blue wire (6-pin Pin 1) -->
  <path d="M740 220 L770 220 L770 185 L810 185" class="wire-comp"/>

  <!-- Fan Low wire: Relay NO → 6-pin -->
  <path d="M282 335 L680 335 L680 205 L810 205" class="wire-fanlo"/>

  <!-- Fan High wire: Relay NO → 6-pin -->
  <path d="M282 385 L660 385 L660 245 L810 245" class="wire-fanhi"/>

  <!-- Furnace wire to separate furnace unit -->
  <path d="M285 467 L660 467 L660 490 L810 490" class="wire-furnace"/>

  <!-- NEUTRAL pass-through wire -->
  <path d="M200 120 L290 120 L290 155 L730 155 L730 295 L810 295" class="wire-neutral"/>

  <!-- Ground pass-through -->
  <path d="M730 295 L730 335 L810 335" class="wire-ground"/>
  <circle cx="730" cy="295" r="3" fill="#fff"/>

  <!-- ==================== DS18B20 FREEZE SENSOR ==================== -->
  <rect x="370" y="300" width="180" height="75" rx="6" fill="#1a0f2a" stroke="#ab47bc" stroke-width="2"/>
  <text x="460" y="322" text-anchor="middle" class="component" fill="#ab47bc">DS18B20</text>
  <text x="460" y="339" text-anchor="middle" class="small" fill="#ce93d8">Waterproof probe on evaporator</text>
  <text x="460" y="354" text-anchor="middle" class="small" fill="#ce93d8">GPIO 42 (4.7K pull-up to 3.3V)</text>
  <text x="460" y="369" text-anchor="middle" class="small" fill="#ce93d8">Software: &lt;32F cut, &gt;45F recover</text>

  <!-- Sensor wire back to ESP32 -->
  <path d="M370 340 L330 340 L330 510 L170 510" class="wire-sensor"/>
  <text x="170" y="525" text-anchor="middle" class="pin" fill="#ab47bc">GPIO 42</text>

  <!-- ==================== 6-PIN CONNECTOR / BRISK II (Right) ==================== -->
  <rect x="810" y="140" width="240" height="250" rx="8" fill="#1a1a1a" stroke="#e65100" stroke-width="2"/>
  <text x="930" y="162" text-anchor="middle" class="component" fill="#ff9800">Dometic Brisk II</text>
  <text x="930" y="176" text-anchor="middle" class="small">6-Pin Cable (120VAC)</text>

  <!-- Pin 1: Blue - Compressor -->
  <circle cx="820" cy="195" r="7" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>
  <text x="835" y="199" class="pin" fill="#42a5f5">1</text>
  <text x="858" y="199" class="label" fill="#90caf9">Compressor</text>
  <text x="1030" y="199" class="small" fill="#42a5f5">BLUE</text>

  <!-- Pin 4: Red - Fan Low -->
  <circle cx="820" cy="215" r="7" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
  <text x="835" y="219" class="pin" fill="#ef5350">4</text>
  <text x="858" y="219" class="label" fill="#ef9a9a">Fan Low</text>
  <text x="1030" y="219" class="small" fill="#ef5350">RED</text>

  <!-- Pin 2: Black - Fan High -->
  <circle cx="820" cy="255" r="7" fill="#555" stroke="#333" stroke-width="1.5"/>
  <text x="835" y="259" class="pin" fill="#aaa">2</text>
  <text x="858" y="259" class="label" fill="#bbb">Fan High</text>
  <text x="1030" y="259" class="small" fill="#aaa">BLACK</text>

  <!-- Pin 3: Yellow - Unused -->
  <circle cx="820" cy="285" r="7" fill="#fdd835" stroke="#f9a825" stroke-width="1.5"/>
  <text x="835" y="289" class="pin" fill="#fdd835">3</text>
  <text x="858" y="289" class="label" fill="#999">Unused (no HP)</text>
  <text x="1030" y="289" class="small" fill="#fdd835">YELLOW</text>

  <!-- Pin 5: White - Neutral -->
  <circle cx="820" cy="315" r="7" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="835" y="319" class="pin" fill="#fff">5</text>
  <text x="858" y="319" class="label" fill="#eee">Neutral</text>
  <text x="1030" y="319" class="small" fill="#fff">WHITE</text>

  <!-- Pin 6: Green/Yellow - Ground -->
  <circle cx="820" cy="345" r="7" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="835" y="349" class="pin" fill="#66bb6a">6</text>
  <text x="858" y="349" class="label" fill="#81c784">Chassis Gnd</text>
  <text x="1030" y="349" class="small" fill="#66bb6a">GRN/YLW</text>

  <!-- No-connect markers -->
  <text x="800" y="289" text-anchor="end" class="small" fill="#fdd835">N/C</text>
  <text x="800" y="349" text-anchor="end" class="small" fill="#66bb6a">PASS-THRU</text>

  <!-- Furnace unit box -->
  <rect x="810" y="470" width="240" height="50" rx="6" fill="#1a1a1a" stroke="#8d6e63" stroke-width="2"/>
  <text x="930" y="492" text-anchor="middle" class="component" fill="#bcaaa4">Furnace</text>
  <text x="930" y="508" text-anchor="middle" class="small">Dry contact closure (separate unit)</text>

  <!-- ==================== COMPRESSOR SIGNAL PATH (highlighted) ==================== -->
  <rect x="30" y="595" width="1020" height="70" rx="8" fill="#0a1a0a" stroke="#4caf50" stroke-width="1.5"/>
  <text x="540" y="615" text-anchor="middle" class="component" fill="#4caf50">Compressor Signal Path</text>
  <text x="540" y="635" text-anchor="middle" class="label" fill="#81c784">ESP32 GPIO 39 HIGH -> HL-52S Relay 2 closes -> 12VDC reaches SSR DC+ -> SSR turns ON -> 120VAC LINE flows through SSR -> Bimetal cutout (NC) -> Blue wire -> Compressor</text>
  <text x="540" y="653" text-anchor="middle" class="small" fill="#ce93d8">SSR handles 120VAC/25A (no contact welding) | HL-52S only switches 12VDC at milliamps | Bimetal cutout is independent hardware backup</text>

  <!-- ==================== WIRING REFERENCE TABLE ==================== -->
  <rect x="30" y="680" width="530" height="160" rx="8" fill="#0f1a30" stroke="#2196f3" stroke-width="1.5"/>
  <text x="295" y="700" text-anchor="middle" class="component" fill="#64b5f6">Wiring Reference</text>

  <!-- Table headers -->
  <text x="45" y="720" class="tbl-header">ESP32</text>
  <text x="110" y="720" class="tbl-header">Relay</text>
  <text x="195" y="720" class="tbl-header">Switches</text>
  <text x="280" y="720" class="tbl-header">Load Path</text>
  <text x="445" y="720" class="tbl-header">6-Pin</text>
  <line x1="40" y1="725" x2="550" y2="725" stroke="#2196f3" stroke-width="0.5"/>

  <text x="45" y="740" class="tbl-cell" fill="#42a5f5">GPIO 39</text>
  <text x="110" y="740" class="tbl-cell">Relay 2</text>
  <text x="195" y="740" class="tbl-cell" fill="#00e676">12VDC</text>
  <text x="280" y="740" class="tbl-cell">-> SSR DC+ -> SSR AC -> Cutout</text>
  <text x="445" y="740" class="tbl-cell" fill="#42a5f5">Pin 1 Blue</text>

  <text x="45" y="758" class="tbl-cell" fill="#ef5350">GPIO 40</text>
  <text x="110" y="758" class="tbl-cell">Relay 3</text>
  <text x="195" y="758" class="tbl-cell" fill="#ff6f00">120VAC</text>
  <text x="280" y="758" class="tbl-cell">-> Direct to fan low</text>
  <text x="445" y="758" class="tbl-cell" fill="#ef5350">Pin 4 Red</text>

  <text x="45" y="776" class="tbl-cell" fill="#aaa">GPIO 41</text>
  <text x="110" y="776" class="tbl-cell">Relay 4</text>
  <text x="195" y="776" class="tbl-cell" fill="#ff6f00">120VAC</text>
  <text x="280" y="776" class="tbl-cell">-> Direct to fan high</text>
  <text x="445" y="776" class="tbl-cell" fill="#aaa">Pin 2 Black</text>

  <text x="45" y="794" class="tbl-cell" fill="#8d6e63">GPIO 38</text>
  <text x="110" y="794" class="tbl-cell">Relay 1</text>
  <text x="195" y="794" class="tbl-cell" fill="#81c784">Dry</text>
  <text x="280" y="794" class="tbl-cell">-> Contact closure</text>
  <text x="445" y="794" class="tbl-cell" fill="#8d6e63">Furnace</text>

  <line x1="40" y1="803" x2="550" y2="803" stroke="#2196f3" stroke-width="0.5"/>
  <text x="45" y="818" class="tbl-cell" fill="#ab47bc">GPIO 42</text>
  <text x="110" y="818" class="tbl-cell">DS18B20</text>
  <text x="195" y="818" class="tbl-cell" fill="#ab47bc">1-Wire</text>
  <text x="280" y="818" class="tbl-cell">Freeze sensor on evaporator coil</text>
  <text x="445" y="818" class="tbl-cell" fill="#ab47bc">4.7K pull-up</text>

  <!-- ==================== NOTES BOX ==================== -->
  <rect x="580" y="680" width="470" height="160" rx="8" fill="#0f1a30" stroke="#ff9800" stroke-width="1.5"/>
  <text x="815" y="700" text-anchor="middle" class="component" fill="#ff9800">Safety Notes</text>

  <text x="595" y="720" class="label" fill="#ff6f00">120VAC on SSR output + Relay 3/4 contacts — junction box required</text>
  <text x="595" y="738" class="label" fill="#ccc">14 AWG minimum for all 120VAC wiring (15A circuit)</text>
  <text x="595" y="756" class="label" fill="#ccc">SSR-25DA needs heatsink (~15W dissipation at 12A load)</text>
  <text x="595" y="774" class="label" fill="#ccc">Relay 2 switches 12VDC only (SSR trigger, milliamp current)</text>

  <line x1="590" y1="785" x2="1040" y2="785" stroke="#ff9800" stroke-width="0.5"/>

  <text x="595" y="802" class="label" fill="#66bb6a">FAILSAFE: SSR + relays all Normally Open</text>
  <text x="595" y="818" class="label" fill="#81c784">ESP32 power loss = all HVAC OFF</text>
  <text x="595" y="834" class="label" fill="#ef5350">No backup thermostat — no Dometic control box</text>

  <!-- ==================== LEGEND ==================== -->
  <line x1="370" y1="430" x2="400" y2="430" stroke="#ff6f00" stroke-width="2.5"/>
  <text x="405" y="434" class="small" fill="#ff6f00">120VAC LINE</text>
  <line x1="490" y1="430" x2="520" y2="430" stroke="#00e676" stroke-width="2"/>
  <text x="525" y="434" class="small" fill="#00e676">12VDC</text>
  <line x1="570" y1="430" x2="600" y2="430" stroke="#fff" stroke-width="2.5"/>
  <text x="605" y="434" class="small" fill="#fff">Neutral</text>
  <line x1="660" y1="430" x2="690" y2="430" stroke="#ab47bc" stroke-width="2"/>
  <text x="695" y="434" class="small" fill="#ab47bc">DS18B20</text>
  <line x1="760" y1="430" x2="790" y2="430" stroke="#42a5f5" stroke-width="2.5"/>
  <text x="795" y="434" class="small" fill="#42a5f5">Compressor</text>

  <!-- SSR Terminal callout box -->
  <rect x="370" y="443" width="440" height="65" rx="6" fill="#0a1a0a" stroke="#4caf50" stroke-width="1"/>
  <text x="590" y="462" text-anchor="middle" class="label" fill="#4caf50">SSR-25DA Terminal Reference</text>
  <text x="385" y="480" class="small" fill="#00e676">DC+ (pin 3): From HL-52S Relay 2 NO</text>
  <text x="385" y="496" class="small" fill="#888">DC- (pin 4): To 12VDC GND</text>
  <text x="600" y="480" class="small" fill="#ff6f00">AC1 (pin 1): From 120VAC LINE</text>
  <text x="600" y="496" class="small" fill="#42a5f5">AC2 (pin 2): To bimetal cutout -> Blue wire</text>
</svg>
