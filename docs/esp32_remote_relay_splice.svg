<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720">
  <style>
    .title { font: bold 18px sans-serif; fill: #eee; }
    .subtitle { font: 13px sans-serif; fill: #888; }
    .label { font: 12px sans-serif; fill: #ccc; }
    .pin { font: bold 11px monospace; }
    .component { font: bold 13px sans-serif; }
    .note { font: italic 11px sans-serif; fill: #888; }
    .small { font: 10px sans-serif; fill: #999; }
    .tbl-header { font: bold 11px sans-serif; fill: #eee; }
    .tbl-cell { font: 11px monospace; fill: #ccc; }
    .wire-common { stroke: #fff; stroke-width: 2.5; fill: none; }
    .wire-comp { stroke: #42a5f5; stroke-width: 2.5; fill: none; }
    .wire-fanhi { stroke: #333; stroke-width: 2.5; fill: none; }
    .wire-fanlo { stroke: #ef5350; stroke-width: 2.5; fill: none; }
    .wire-furnace { stroke: #8d6e63; stroke-width: 2.5; fill: none; }
    .wire-ground { stroke: #66bb6a; stroke-width: 2; fill: none; stroke-dasharray: 6,3; }
    .wire-unused { stroke: #fdd835; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
  </style>

  <!-- Background -->
  <rect width="960" height="720" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" class="title">ESP32 Remote Relay → Dometic Control Box (Direct Wiring)</text>
  <text x="480" y="48" text-anchor="middle" class="subtitle">ESP32 is sole thermostat controller — Dometic thermostat removed from circuit</text>

  <!-- ==================== ESP32 + RELAY MODULE (Left) ==================== -->
  <rect x="30" y="75" width="260" height="310" rx="8" fill="#16213e" stroke="#4cc9f0" stroke-width="2"/>
  <text x="160" y="98" text-anchor="middle" class="component" fill="#4cc9f0">ESP32-S3 Remote</text>
  <text x="160" y="114" text-anchor="middle" class="small">192.168.71.153</text>

  <!-- Relay module sub-box -->
  <rect x="45" y="125" width="230" height="245" rx="4" fill="#0f1a30" stroke="#2196f3" stroke-width="1"/>
  <text x="160" y="143" text-anchor="middle" class="label" fill="#64b5f6">HL-52S 4-Channel Relay Module</text>
  <text x="160" y="157" text-anchor="middle" class="small">Active HIGH | 5V VCC | NO contacts</text>

  <!-- Relay 1: Furnace -->
  <rect x="55" y="168" width="210" height="42" rx="3" fill="#2a1a1a" stroke="#8d6e63" stroke-width="1.2"/>
  <text x="65" y="185" class="pin" fill="#8d6e63">GPIO 38</text>
  <text x="145" y="185" class="label" fill="#bcaaa4">Relay 1: FURNACE</text>
  <circle cx="240" cy="183" r="4" fill="#fff"/>
  <text x="240" y="203" text-anchor="middle" class="small">COM</text>
  <circle cx="258" cy="183" r="4" fill="#8d6e63"/>
  <text x="258" y="203" text-anchor="middle" class="small">NO</text>

  <!-- Relay 2: Compressor -->
  <rect x="55" y="218" width="210" height="42" rx="3" fill="#1a1a2a" stroke="#42a5f5" stroke-width="1.2"/>
  <text x="65" y="235" class="pin" fill="#42a5f5">GPIO 39</text>
  <text x="145" y="235" class="label" fill="#90caf9">Relay 2: COMPRESSOR</text>
  <circle cx="240" cy="233" r="4" fill="#fff"/>
  <text x="240" y="253" text-anchor="middle" class="small">COM</text>
  <circle cx="258" cy="233" r="4" fill="#42a5f5"/>
  <text x="258" y="253" text-anchor="middle" class="small">NO</text>

  <!-- Relay 3: Fan Low -->
  <rect x="55" y="268" width="210" height="42" rx="3" fill="#2a1a1a" stroke="#ef5350" stroke-width="1.2"/>
  <text x="65" y="285" class="pin" fill="#ef5350">GPIO 40</text>
  <text x="145" y="285" class="label" fill="#ef9a9a">Relay 3: FAN LOW</text>
  <circle cx="240" cy="283" r="4" fill="#fff"/>
  <text x="240" y="303" text-anchor="middle" class="small">COM</text>
  <circle cx="258" cy="283" r="4" fill="#ef5350"/>
  <text x="258" y="303" text-anchor="middle" class="small">NO</text>

  <!-- Relay 4: Fan High -->
  <rect x="55" y="318" width="210" height="42" rx="3" fill="#1a1a1a" stroke="#555" stroke-width="1.2"/>
  <text x="65" y="335" class="pin" fill="#aaa">GPIO 41</text>
  <text x="145" y="335" class="label" fill="#bbb">Relay 4: FAN HIGH</text>
  <circle cx="240" cy="333" r="4" fill="#fff"/>
  <text x="240" y="353" text-anchor="middle" class="small">COM</text>
  <circle cx="258" cy="333" r="4" fill="#555"/>
  <text x="258" y="353" text-anchor="middle" class="small">NO</text>

  <!-- ==================== WAGO CONNECTORS (Middle) ==================== -->
  <text x="490" y="78" text-anchor="middle" class="label" fill="#aaa">Wago 221-412 (2-Port) Connection Points</text>

  <!-- Common bus label -->
  <text x="340" y="420" text-anchor="middle" class="small" fill="#fff">Common 24V Bus</text>

  <!-- Vertical common bus connecting all relay COM pins -->
  <line x1="240" y1="183" x2="240" y2="400" stroke="#fff" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
  <circle cx="240" cy="233" r="3" fill="#fff"/>
  <circle cx="240" cy="283" r="3" fill="#fff"/>
  <circle cx="240" cy="333" r="3" fill="#fff"/>

  <!-- Common bus to Wago -->
  <line x1="240" y1="400" x2="455" y2="400" class="wire-common"/>

  <!-- Wago blocks (2-port: ESP32 relay wire → control box wire) -->
  <!-- Wago: Common -->
  <rect x="455" y="388" width="70" height="24" rx="3" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="490" y="404" text-anchor="middle" class="small" fill="#fff">WAGO</text>

  <!-- Wago: Compressor -->
  <rect x="455" y="138" width="70" height="24" rx="3" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="490" y="154" text-anchor="middle" class="small" fill="#fff">WAGO</text>

  <!-- Wago: Fan Low -->
  <rect x="455" y="198" width="70" height="24" rx="3" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="490" y="214" text-anchor="middle" class="small" fill="#fff">WAGO</text>

  <!-- Wago: Fan High -->
  <rect x="455" y="258" width="70" height="24" rx="3" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="490" y="274" text-anchor="middle" class="small" fill="#fff">WAGO</text>

  <!-- Wago: Furnace -->
  <rect x="455" y="328" width="70" height="24" rx="3" fill="#e65100" stroke="#ff9800" stroke-width="1.5"/>
  <text x="490" y="344" text-anchor="middle" class="small" fill="#fff">WAGO</text>

  <!-- ==================== WIRES: Relay NO → Wago ==================== -->
  <!-- Compressor NO → Wago -->
  <path d="M262 233 L370 233 L370 150 L455 150" class="wire-comp"/>
  <!-- Fan Low NO → Wago -->
  <path d="M262 283 L390 283 L390 210 L455 210" class="wire-fanlo"/>
  <!-- Fan High NO → Wago -->
  <path d="M262 333 L410 333 L410 270 L455 270" class="wire-fanhi"/>
  <!-- Furnace NO → Wago -->
  <path d="M262 183 L350 183 L350 340 L455 340" class="wire-furnace"/>

  <!-- ==================== DOMETIC CONTROL BOX (Right) ==================== -->
  <rect x="700" y="75" width="230" height="330" rx="8" fill="#1a1a1a" stroke="#e65100" stroke-width="2"/>
  <text x="815" y="98" text-anchor="middle" class="component" fill="#ff9800">Dometic Control Box</text>
  <text x="815" y="114" text-anchor="middle" class="small">P/N 3313199.000 (Etratech)</text>
  <text x="815" y="128" text-anchor="middle" class="small">Thermostat Input Terminals</text>

  <!-- Pin 1: Blue - Compressor -->
  <circle cx="710" cy="155" r="7" fill="#42a5f5" stroke="#1565c0" stroke-width="1.5"/>
  <text x="725" y="159" class="pin" fill="#42a5f5">Y</text>
  <text x="760" y="159" class="label" fill="#90caf9">Compressor</text>
  <text x="905" y="159" class="small" fill="#42a5f5">BLUE</text>

  <!-- Pin 2: Black - Fan High -->
  <circle cx="710" cy="195" r="7" fill="#555" stroke="#333" stroke-width="1.5"/>
  <text x="725" y="199" class="pin" fill="#aaa">G2</text>
  <text x="760" y="199" class="label" fill="#bbb">Fan High</text>
  <text x="905" y="199" class="small" fill="#aaa">BLACK</text>

  <!-- Pin 3: Yellow - Unused -->
  <circle cx="710" cy="235" r="7" fill="#fdd835" stroke="#f9a825" stroke-width="1.5"/>
  <text x="725" y="239" class="pin" fill="#fdd835">O</text>
  <text x="760" y="239" class="label" fill="#999">Unused (no HP)</text>
  <text x="905" y="239" class="small" fill="#fdd835">YELLOW</text>

  <!-- Pin 4: Red - Fan Low -->
  <circle cx="710" cy="275" r="7" fill="#ef5350" stroke="#c62828" stroke-width="1.5"/>
  <text x="725" y="279" class="pin" fill="#ef5350">G1</text>
  <text x="760" y="279" class="label" fill="#ef9a9a">Fan Low</text>
  <text x="905" y="279" class="small" fill="#ef5350">RED</text>

  <!-- Pin 5: White - Common -->
  <circle cx="710" cy="315" r="7" fill="#fff" stroke="#bbb" stroke-width="1.5"/>
  <text x="725" y="319" class="pin" fill="#fff">C</text>
  <text x="760" y="319" class="label" fill="#eee">Common (24V)</text>
  <text x="905" y="319" class="small" fill="#fff">WHITE</text>

  <!-- Pin 6: Green/Yellow - Ground -->
  <circle cx="710" cy="355" r="7" fill="#66bb6a" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="725" y="359" class="pin" fill="#66bb6a">GND</text>
  <text x="760" y="359" class="label" fill="#81c784">Chassis Gnd</text>
  <text x="905" y="359" class="small" fill="#66bb6a">GRN/YLW</text>

  <!-- ==================== WIRES: Wago → Control Box ==================== -->
  <!-- Compressor: Wago → Y terminal Blue -->
  <line x1="525" y1="150" x2="703" y2="155" class="wire-comp"/>
  <!-- Fan High: Wago → G2 terminal Black -->
  <path d="M525 270 L650 270 L650 195 L703 195" class="wire-fanhi"/>
  <!-- Fan Low: Wago → G1 terminal Red -->
  <path d="M525 210 L640 210 L640 275 L703 275" class="wire-fanlo"/>
  <!-- Common: Wago → C terminal White -->
  <path d="M525 400 L670 400 L670 315 L703 315" class="wire-common"/>
  <!-- Furnace: Wago → Furnace terminals (separate) -->
  <path d="M525 340 L630 340 L630 440 L760 440" class="wire-furnace"/>

  <!-- Furnace unit box -->
  <rect x="700" y="420" width="230" height="45" rx="6" fill="#1a1a1a" stroke="#8d6e63" stroke-width="2"/>
  <text x="815" y="440" text-anchor="middle" class="component" fill="#bcaaa4">Furnace</text>
  <text x="815" y="455" text-anchor="middle" class="small">Separate Screw Terminals on Control Box</text>

  <!-- Common branch to furnace -->
  <path d="M670 400 L670 448 L700 448" class="wire-common" stroke-width="1.5"/>
  <circle cx="670" cy="400" r="3" fill="#fff"/>

  <!-- No-connect indicators -->
  <text x="680" y="235" text-anchor="end" class="small" fill="#fdd835">NOT CONNECTED</text>
  <text x="680" y="355" text-anchor="end" class="small" fill="#66bb6a">EXISTING (no change)</text>

  <!-- ==================== WIRE COLOR CODE TABLE ==================== -->
  <rect x="30" y="485" width="560" height="225" rx="8" fill="#0f1a30" stroke="#2196f3" stroke-width="1.5"/>
  <text x="310" y="508" text-anchor="middle" class="component" fill="#64b5f6">Wire Color Code &amp; Connection Reference</text>

  <!-- Table headers -->
  <text x="45" y="530" class="tbl-header">Control Box</text>
  <text x="145" y="530" class="tbl-header">Color</text>
  <text x="215" y="530" class="tbl-header">Terminal</text>
  <text x="280" y="530" class="tbl-header">Function</text>
  <text x="400" y="530" class="tbl-header">ESP32 Relay</text>
  <text x="510" y="530" class="tbl-header">Wago?</text>
  <line x1="40" y1="535" x2="580" y2="535" stroke="#2196f3" stroke-width="0.5"/>

  <!-- Row 1: White / Common -->
  <rect x="45" y="541" width="12" height="12" rx="2" fill="#fff" stroke="#bbb" stroke-width="0.5"/>
  <text x="65" y="552" class="tbl-cell" fill="#fff">White</text>
  <text x="145" y="552" class="tbl-cell">Common</text>
  <text x="215" y="552" class="tbl-cell">C</text>
  <text x="280" y="552" class="tbl-cell">24V Return</text>
  <text x="400" y="552" class="tbl-cell">All relay COM</text>
  <text x="510" y="552" class="tbl-cell" fill="#66bb6a">221-412</text>

  <!-- Row 2: Blue / Compressor -->
  <rect x="45" y="561" width="12" height="12" rx="2" fill="#42a5f5"/>
  <text x="65" y="572" class="tbl-cell" fill="#42a5f5">Blue</text>
  <text x="145" y="572" class="tbl-cell">Compressor</text>
  <text x="215" y="572" class="tbl-cell">Y</text>
  <text x="280" y="572" class="tbl-cell">Comp Contactor</text>
  <text x="400" y="572" class="tbl-cell">GPIO 39 NO</text>
  <text x="510" y="572" class="tbl-cell" fill="#66bb6a">221-412</text>

  <!-- Row 3: Red / Fan Low -->
  <rect x="45" y="581" width="12" height="12" rx="2" fill="#ef5350"/>
  <text x="65" y="592" class="tbl-cell" fill="#ef5350">Red</text>
  <text x="145" y="592" class="tbl-cell">Fan Low</text>
  <text x="215" y="592" class="tbl-cell">G1</text>
  <text x="280" y="592" class="tbl-cell">Fan Low Speed</text>
  <text x="400" y="592" class="tbl-cell">GPIO 40 NO</text>
  <text x="510" y="592" class="tbl-cell" fill="#66bb6a">221-412</text>

  <!-- Row 4: Black / Fan High -->
  <rect x="45" y="601" width="12" height="12" rx="2" fill="#555" stroke="#888" stroke-width="0.5"/>
  <text x="65" y="612" class="tbl-cell" fill="#aaa">Black</text>
  <text x="145" y="612" class="tbl-cell">Fan High</text>
  <text x="215" y="612" class="tbl-cell">G2</text>
  <text x="280" y="612" class="tbl-cell">Fan High Speed</text>
  <text x="400" y="612" class="tbl-cell">GPIO 41 NO</text>
  <text x="510" y="612" class="tbl-cell" fill="#66bb6a">221-412</text>

  <!-- Row 5: Brown / Furnace -->
  <rect x="45" y="621" width="12" height="12" rx="2" fill="#8d6e63"/>
  <text x="65" y="632" class="tbl-cell" fill="#bcaaa4">Brown</text>
  <text x="145" y="632" class="tbl-cell">Furnace</text>
  <text x="215" y="632" class="tbl-cell">W</text>
  <text x="280" y="632" class="tbl-cell">Furnace Call</text>
  <text x="400" y="632" class="tbl-cell">GPIO 38 NO</text>
  <text x="510" y="632" class="tbl-cell" fill="#66bb6a">221-412</text>

  <line x1="40" y1="639" x2="580" y2="639" stroke="#2196f3" stroke-width="0.5"/>

  <!-- Row 6: Yellow / Unused -->
  <rect x="45" y="645" width="12" height="12" rx="2" fill="#fdd835"/>
  <text x="65" y="656" class="tbl-cell" fill="#fdd835">Yellow</text>
  <text x="145" y="656" class="tbl-cell">Rev Valve</text>
  <text x="215" y="656" class="tbl-cell">O</text>
  <text x="280" y="656" class="tbl-cell">Unused (no HP)</text>
  <text x="400" y="656" class="tbl-cell">-</text>
  <text x="510" y="656" class="tbl-cell" fill="#ef5350">N/C</text>

  <!-- Row 7: Green/Yellow / Ground -->
  <rect x="45" y="665" width="12" height="12" rx="2" fill="#66bb6a" stroke="#2e7d32" stroke-width="0.5"/>
  <text x="65" y="676" class="tbl-cell" fill="#66bb6a">Grn/Ylw</text>
  <text x="145" y="676" class="tbl-cell">Ground</text>
  <text x="215" y="676" class="tbl-cell">GND</text>
  <text x="280" y="676" class="tbl-cell">Chassis Ground</text>
  <text x="400" y="676" class="tbl-cell">-</text>
  <text x="510" y="676" class="tbl-cell" fill="#888">Existing</text>

  <!-- ==================== NOTES BOX ==================== -->
  <rect x="610" y="485" width="320" height="225" rx="8" fill="#0f1a30" stroke="#ff9800" stroke-width="1.5"/>
  <text x="770" y="508" text-anchor="middle" class="component" fill="#ff9800">Notes</text>

  <text x="625" y="530" class="label" fill="#ccc">All signals are 24VAC (18 AWG)</text>
  <text x="625" y="550" class="label" fill="#ccc">Use Wago 221-412 (2-port) at each connection</text>
  <text x="625" y="570" class="label" fill="#ccc">ESP32 relay wire → control box terminal wire</text>
  <text x="625" y="590" class="label" fill="#ccc">Dometic thermostat removed from circuit</text>

  <line x1="620" y1="605" x2="920" y2="605" stroke="#ff9800" stroke-width="0.5"/>

  <text x="625" y="625" class="label" fill="#66bb6a">FAILSAFE: Relays are Normally Open.</text>
  <text x="625" y="645" class="label" fill="#81c784">ESP32 power loss = all HVAC OFF.</text>
  <text x="625" y="665" class="label" fill="#81c784">No backup thermostat in circuit.</text>

  <line x1="620" y1="678" x2="920" y2="678" stroke="#ff9800" stroke-width="0.5"/>
  <text x="625" y="698" class="label" fill="#ef5350">Freeze sensor in control box remains active</text>

  <!-- ==================== LEGEND ==================== -->
  <line x1="625" y1="464" x2="655" y2="464" stroke="#ccc" stroke-width="2"/>
  <text x="660" y="468" class="small" fill="#ccc">ESP32 relay → control box (direct)</text>
</svg>
