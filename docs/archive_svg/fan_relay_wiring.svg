<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="monospace" font-size="13">
  <!-- Background -->
  <rect width="700" height="420" fill="#1a1a2e" rx="8"/>

  <!-- Title -->
  <text x="350" y="30" fill="#e0e0e0" font-size="16" text-anchor="middle" font-weight="bold">Fan Speed Relay Wiring</text>
  <text x="350" y="50" fill="#888" font-size="11" text-anchor="middle">ESP32-S3 → Relay Module (Active HIGH, 5V VCC)</text>

  <!-- ESP32 Box -->
  <rect x="30" y="80" width="140" height="220" fill="#16213e" stroke="#4cc9f0" stroke-width="2" rx="6"/>
  <text x="100" y="105" fill="#4cc9f0" font-size="14" text-anchor="middle" font-weight="bold">ESP32-S3</text>

  <!-- ESP32 pins -->
  <text x="50" y="155" fill="#90be6d" font-size="12">GPIO 40</text>
  <text x="50" y="225" fill="#90be6d" font-size="12">GPIO 41</text>
  <text x="50" y="275" fill="#f94144" font-size="12">GND</text>

  <!-- Relay Module Box -->
  <rect x="500" y="80" width="170" height="220" fill="#16213e" stroke="#43a047" stroke-width="2" rx="6"/>
  <text x="585" y="105" fill="#43a047" font-size="14" text-anchor="middle" font-weight="bold">Relay Module</text>
  <text x="585" y="120" fill="#888" font-size="10" text-anchor="middle">Active HIGH, 5V VCC</text>
  <text x="585" y="133" fill="#888" font-size="10" text-anchor="middle">Jumper = HIGH trigger</text>

  <!-- Relay module pins -->
  <text x="515" y="165" fill="#90be6d" font-size="12">IN1 (Fan Low)</text>
  <text x="515" y="225" fill="#90be6d" font-size="12">IN2 (Fan High)</text>
  <text x="515" y="275" fill="#f94144" font-size="12">GND</text>

  <!-- GPIO 40 line -->
  <line x1="170" y1="151" x2="500" y2="161" stroke="#90be6d" stroke-width="2"/>

  <!-- GPIO 41 line -->
  <line x1="170" y1="221" x2="500" y2="221" stroke="#90be6d" stroke-width="2"/>

  <!-- GND line -->
  <line x1="170" y1="271" x2="500" y2="271" stroke="#f94144" stroke-width="2"/>

  <!-- Legend -->
  <rect x="30" y="350" width="640" height="55" fill="#0f0f23" stroke="#333" stroke-width="1" rx="4"/>
  <text x="50" y="375" fill="#e0e0e0" font-size="11" font-weight="bold">Key:</text>
  <line x1="90" y1="372" x2="120" y2="372" stroke="#90be6d" stroke-width="2"/>
  <text x="125" y="375" fill="#90be6d" font-size="11">Signal (GPIO→IN)</text>
  <line x1="310" y1="372" x2="340" y2="372" stroke="#f94144" stroke-width="2"/>
  <text x="345" y="375" fill="#f94144" font-size="11">GND (shared)</text>
  <text x="50" y="395" fill="#888" font-size="10">GPIO 40 = Fan Low, GPIO 41 = Fan High. Only Low + High speeds.</text>
  <text x="50" y="407" fill="#888" font-size="10">boot.py drives GPIOs LOW (OFF) immediately on startup.</text>
</svg>
