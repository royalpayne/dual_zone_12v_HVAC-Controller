<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="monospace" font-size="12">
  <!-- Background -->
  <rect width="900" height="480" fill="#f5f5f0" rx="4"/>
  <text x="450" y="25" fill="#333" font-size="16" text-anchor="middle" font-weight="bold">Fan Relay Wiring — Breadboard Layout</text>
  <text x="450" y="42" fill="#888" font-size="11" text-anchor="middle">GPIO 40 (Fan Low) + GPIO 41 (Fan High) → Active HIGH Relay Module</text>

  <!-- ESP32 Board -->
  <rect x="20" y="60" width="120" height="240" fill="#1a5276" stroke="#154360" stroke-width="2" rx="4"/>
  <text x="80" y="85" fill="white" font-size="13" text-anchor="middle" font-weight="bold">ESP32-S3</text>
  <rect x="55" y="95" width="50" height="10" fill="#333" rx="2"/>
  <text x="80" y="103" fill="#aaa" font-size="7" text-anchor="middle">USB</text>

  <!-- ESP32 Pin labels and dots -->
  <circle cx="140" cy="140" r="5" fill="#f39c12"/>
  <text x="95" y="144" fill="white" font-size="10" text-anchor="end">GPIO 40</text>

  <circle cx="140" cy="200" r="5" fill="#f39c12"/>
  <text x="95" y="204" fill="white" font-size="10" text-anchor="end">GPIO 41</text>

  <circle cx="140" cy="260" r="5" fill="#e74c3c"/>
  <text x="95" y="264" fill="white" font-size="10" text-anchor="end">GND</text>

  <!-- Breadboard -->
  <rect x="220" y="50" width="420" height="260" fill="#e8e4d8" stroke="#999" stroke-width="2" rx="4"/>
  <text x="430" y="72" fill="#666" font-size="11" text-anchor="middle">BREADBOARD</text>

  <!-- Power rails top -->
  <rect x="230" y="80" width="400" height="12" fill="#ccccff" stroke="#00c" stroke-width="0.5" rx="2"/>
  <text x="238" y="90" fill="#00c" font-size="10" font-weight="bold">−</text>
  <text x="620" y="90" fill="#00c" font-size="9">GND rail</text>

  <!-- Row A (GPIO 40 row) -->
  <text x="235" y="135" fill="#666" font-size="9">Row 1</text>
  <circle cx="280" cy="130" r="4" fill="#f39c12"/>
  <circle cx="300" cy="130" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="320" cy="130" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="340" cy="130" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="360" cy="130" r="4" fill="#27ae60"/>
  <text x="280" y="120" fill="#333" font-size="8" text-anchor="middle">a</text>
  <text x="300" y="120" fill="#333" font-size="8" text-anchor="middle">b</text>
  <text x="320" y="120" fill="#333" font-size="8" text-anchor="middle">c</text>
  <text x="340" y="120" fill="#333" font-size="8" text-anchor="middle">d</text>
  <text x="360" y="120" fill="#333" font-size="8" text-anchor="middle">e</text>

  <!-- Row B (GPIO 41 row) -->
  <text x="235" y="195" fill="#666" font-size="9">Row 5</text>
  <circle cx="280" cy="190" r="4" fill="#f39c12"/>
  <circle cx="300" cy="190" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="320" cy="190" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="340" cy="190" r="4" fill="#ddd" stroke="#999" stroke-width="0.5"/>
  <circle cx="360" cy="190" r="4" fill="#27ae60"/>
  <text x="280" y="180" fill="#333" font-size="8" text-anchor="middle">a</text>
  <text x="300" y="180" fill="#333" font-size="8" text-anchor="middle">b</text>
  <text x="360" y="180" fill="#333" font-size="8" text-anchor="middle">e</text>

  <!-- WIRES from ESP32 to breadboard -->
  <line x1="145" y1="140" x2="276" y2="130" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>
  <line x1="145" y1="200" x2="276" y2="190" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>

  <!-- GND wire from ESP32 to - rail -->
  <line x1="145" y1="260" x2="185" y2="260" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="260" x2="185" y2="86" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <line x1="185" y1="86" x2="260" y2="86" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <circle cx="260" cy="86" r="3" fill="#3498db"/>

  <!-- Relay Module -->
  <rect x="700" y="60" width="170" height="240" fill="#2c3e50" stroke="#1a252f" stroke-width="2" rx="4"/>
  <text x="785" y="85" fill="white" font-size="13" text-anchor="middle" font-weight="bold">Relay Module</text>
  <text x="785" y="100" fill="#aaa" font-size="9" text-anchor="middle">Active HIGH, 5V VCC</text>
  <text x="785" y="115" fill="#aaa" font-size="9" text-anchor="middle">Jumper: HIGH trigger</text>

  <circle cx="700" cy="140" r="5" fill="#27ae60"/>
  <text x="760" y="144" fill="white" font-size="10">IN1 (Fan Low)</text>

  <circle cx="700" cy="190" r="5" fill="#27ae60"/>
  <text x="760" y="194" fill="white" font-size="10">IN2 (Fan High)</text>

  <circle cx="700" cy="260" r="5" fill="#3498db"/>
  <text x="760" y="264" fill="white" font-size="10">GND</text>

  <!-- Green signal wires from breadboard to relay -->
  <line x1="364" y1="130" x2="696" y2="140" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <line x1="364" y1="190" x2="696" y2="190" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>

  <!-- GND wire from - rail to relay GND -->
  <line x1="500" y1="86" x2="500" y2="260" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <circle cx="500" cy="86" r="3" fill="#3498db"/>
  <line x1="500" y1="260" x2="696" y2="260" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>

  <!-- Labels -->
  <text x="160" y="138" fill="#f39c12" font-size="9">GPIO 40</text>
  <text x="160" y="202" fill="#f39c12" font-size="9">GPIO 41</text>

  <!-- Instructions -->
  <rect x="20" y="340" width="860" height="130" fill="white" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="40" y="365" fill="#333" font-size="13" font-weight="bold">Wiring Steps:</text>

  <circle cx="50" cy="390" r="10" fill="#3498db"/>
  <text x="50" y="394" fill="white" font-size="10" text-anchor="middle">1</text>
  <text x="70" y="394" fill="#333" font-size="11">ESP32 GND → breadboard − rail → relay module GND (blue wire)</text>

  <circle cx="50" cy="415" r="10" fill="#f39c12"/>
  <text x="50" y="419" fill="white" font-size="10" text-anchor="middle">2</text>
  <text x="70" y="419" fill="#333" font-size="11">ESP32 GPIO 40 + 42 → breadboard row hole "a" (orange wires)</text>

  <circle cx="50" cy="440" r="10" fill="#27ae60"/>
  <text x="50" y="444" fill="white" font-size="10" text-anchor="middle">3</text>
  <text x="70" y="444" fill="#333" font-size="11">SAME ROW hole "e" → relay module IN1/IN2 (green wires). Same row = same electrical node.</text>

  <text x="70" y="465" fill="#888" font-size="10">boot.py drives GPIOs LOW (OFF) immediately on startup. GPIO 40 = Fan Low, GPIO 41 = Fan High. Only Low + High speeds.</text>
</svg>
