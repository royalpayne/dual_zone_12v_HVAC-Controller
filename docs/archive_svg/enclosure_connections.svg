<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <rect width="900" height="650" fill="#f5f5f5"/>

  <!-- Title -->
  <rect x="20" y="12" width="860" height="48" rx="4" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="450" y="33" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">ESP32 Remote Controller — Enclosure Connections</text>
  <text x="450" y="50" text-anchor="middle" font-size="10" fill="#777">Cable entry points and external wiring  |  RV Thermostat Project</text>

  <!-- ==================== -->
  <!-- ENCLOSURE - isometric-ish 3D box -->
  <!-- ==================== -->

  <!-- Box top face -->
  <polygon points="150,160 650,160 720,110 220,110" fill="#d0d0d0" stroke="#888" stroke-width="1.5"/>
  <!-- Box front face -->
  <rect x="150" y="160" width="500" height="280" rx="3" fill="#e8e8e8" stroke="#888" stroke-width="1.5"/>
  <!-- Box right face -->
  <polygon points="650,160 720,110 720,390 650,440" fill="#c0c0c0" stroke="#888" stroke-width="1.5"/>

  <!-- Enclosure label -->
  <text x="400" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">PROJECT ENCLOSURE</text>
  <text x="400" y="212" text-anchor="middle" font-size="9" fill="#888">ABS plastic enclosure (~8" x 6" x 3")</text>

  <!-- Board outline inside (visible through transparent lid idea) -->
  <rect x="195" y="230" width="410" height="170" rx="4" fill="none" stroke="#4caf50" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="400" y="252" text-anchor="middle" font-size="9" fill="#4caf50">6" x 4" project board (mounted on standoffs)</text>

  <!-- ESP32 inside -->
  <rect x="210" y="270" width="140" height="55" rx="3" fill="#263238" stroke="#455a64" stroke-width="1" opacity="0.6"/>
  <text x="280" y="295" text-anchor="middle" font-size="8" fill="#b0bec5">ESP32-S3</text>
  <text x="280" y="307" text-anchor="middle" font-size="7" fill="#78909c">N16R8</text>

  <!-- Relay module inside -->
  <rect x="390" y="262" width="195" height="100" rx="3" fill="#1b5e20" stroke="#2e7d32" stroke-width="1" opacity="0.6"/>
  <text x="487" y="290" text-anchor="middle" font-size="8" fill="#a5d6a7">HL-52S Relay</text>
  <text x="487" y="302" text-anchor="middle" font-size="7" fill="#81c784">Module</text>

  <!-- Buck converter inside -->
  <rect x="390" y="370" width="110" height="40" rx="3" fill="#3e2723" stroke="#5d4037" stroke-width="1" opacity="0.6"/>
  <text x="445" y="393" text-anchor="middle" font-size="7" fill="#bcaaa4">Buck 12V→5V</text>

  <!-- ==================== -->
  <!-- LEFT SIDE - LOW VOLTAGE CABLES -->
  <!-- ==================== -->

  <!-- Cable gland 1: USB -->
  <ellipse cx="150" cy="280" rx="5" ry="12" fill="#555" stroke="#333" stroke-width="1.2"/>
  <line x1="150" y1="280" x2="90" y2="280" stroke="#333" stroke-width="4"/>
  <rect x="55" y="272" width="38" height="16" rx="3" fill="#37474f" stroke="#555" stroke-width="1"/>
  <text x="74" y="283" text-anchor="middle" font-size="7" fill="white">USB-C</text>
  <!-- Label -->
  <line x1="74" y1="270" x2="74" y2="240" stroke="#666" stroke-width="0.7"/>
  <rect x="15" y="222" width="120" height="20" rx="3" fill="white" stroke="#666" stroke-width="0.8"/>
  <text x="75" y="236" text-anchor="middle" font-size="8" fill="#333" font-weight="bold">1  USB-C Programming</text>

  <!-- Cable gland 2: I2C to OLED/BME280 -->
  <ellipse cx="150" cy="325" rx="5" ry="10" fill="#1565c0" stroke="#0d47a1" stroke-width="1.2"/>
  <line x1="150" y1="325" x2="80" y2="325" stroke="#1565c0" stroke-width="3.5"/>
  <!-- 4 wires fanning out -->
  <line x1="80" y1="325" x2="45" y2="315" stroke="#42a5f5" stroke-width="1.2"/>
  <line x1="80" y1="325" x2="45" y2="321" stroke="#66bb6a" stroke-width="1.2"/>
  <line x1="80" y1="325" x2="45" y2="329" stroke="#e53935" stroke-width="1.2"/>
  <line x1="80" y1="325" x2="45" y2="335" stroke="#333" stroke-width="1.2"/>
  <text x="30" y="315" font-size="6" fill="#42a5f5">SDA</text>
  <text x="30" y="322" font-size="6" fill="#66bb6a">SCL</text>
  <text x="30" y="330" font-size="6" fill="#e53935">3V3</text>
  <text x="30" y="337" font-size="6" fill="#333">GND</text>
  <!-- Label -->
  <line x1="74" y1="312" x2="74" y2="325" stroke="#1565c0" stroke-width="0.7"/>
  <rect x="15" y="298" width="120" height="20" rx="3" fill="white" stroke="#1565c0" stroke-width="0.8"/>
  <text x="75" y="311" text-anchor="middle" font-size="8" fill="#0d47a1" font-weight="bold">2  I2C → OLED/BME280</text>

  <!-- Cable gland 3: DS18B20 -->
  <ellipse cx="150" cy="370" rx="5" ry="9" fill="#00838f" stroke="#006064" stroke-width="1.2"/>
  <line x1="150" y1="370" x2="80" y2="370" stroke="#00838f" stroke-width="3"/>
  <!-- 3 wires -->
  <line x1="80" y1="370" x2="45" y2="362" stroke="#e53935" stroke-width="1.2"/>
  <line x1="80" y1="370" x2="45" y2="370" stroke="#ffc107" stroke-width="1.2"/>
  <line x1="80" y1="370" x2="45" y2="378" stroke="#333" stroke-width="1.2"/>
  <text x="30" y="363" font-size="6" fill="#e53935">3V3</text>
  <text x="30" y="371" font-size="6" fill="#ffc107">DATA</text>
  <text x="30" y="379" font-size="6" fill="#333">GND</text>
  <!-- Label -->
  <line x1="74" y1="355" x2="74" y2="365" stroke="#00838f" stroke-width="0.7"/>
  <rect x="15" y="342" width="120" height="20" rx="3" fill="white" stroke="#00838f" stroke-width="0.8"/>
  <text x="75" y="356" text-anchor="middle" font-size="8" fill="#006064" font-weight="bold">3  DS18B20 Freeze Probe</text>

  <!-- ==================== -->
  <!-- BOTTOM SIDE - POWER IN -->
  <!-- ==================== -->

  <!-- Cable gland 4: 12V DC input -->
  <ellipse cx="300" cy="440" ry="5" rx="12" fill="#b71c1c" stroke="#880e0e" stroke-width="1.2"/>
  <line x1="300" y1="440" x2="300" y2="490" stroke="#b71c1c" stroke-width="4.5"/>
  <!-- 2 wires -->
  <line x1="300" y1="490" x2="288" y2="520" stroke="#e53935" stroke-width="1.5"/>
  <line x1="300" y1="490" x2="312" y2="520" stroke="#333" stroke-width="1.5"/>
  <text x="278" y="530" font-size="7" fill="#e53935" font-weight="bold">V+</text>
  <text x="308" y="530" font-size="7" fill="#333" font-weight="bold">GND</text>
  <!-- Label -->
  <rect x="235" y="538" width="130" height="22" rx="3" fill="white" stroke="#b71c1c" stroke-width="0.8"/>
  <text x="300" y="553" text-anchor="middle" font-size="8" fill="#b71c1c" font-weight="bold">4  12V DC Input (RV battery)</text>

  <!-- ==================== -->
  <!-- RIGHT SIDE - HIGH POWER OUTPUT -->
  <!-- ==================== -->

  <!-- Cable gland 5: Furnace dry contact -->
  <ellipse cx="650" cy="265" rx="5" ry="9" fill="#0d47a1" stroke="#0a3570" stroke-width="1.2"/>
  <line x1="650" y1="265" x2="750" y2="238" stroke="#0d47a1" stroke-width="3"/>
  <!-- 2 wires -->
  <line x1="750" y1="238" x2="790" y2="230" stroke="#42a5f5" stroke-width="1.2"/>
  <line x1="750" y1="238" x2="790" y2="246" stroke="#42a5f5" stroke-width="1.2"/>
  <text x="795" y="233" font-size="6" fill="#1565c0">NO</text>
  <text x="795" y="249" font-size="6" fill="#1565c0">COM</text>
  <!-- Label -->
  <rect x="740" y="210" width="140" height="20" rx="3" fill="white" stroke="#0d47a1" stroke-width="0.8"/>
  <text x="810" y="223" text-anchor="middle" font-size="8" fill="#0d47a1" font-weight="bold">5  Furnace (dry contact)</text>

  <!-- Cable gland 6: SSR trigger (12VDC) -->
  <ellipse cx="650" cy="320" rx="5" ry="10" fill="#880e4f" stroke="#6a0038" stroke-width="1.2"/>
  <line x1="650" y1="320" x2="755" y2="300" stroke="#880e4f" stroke-width="3.5"/>
  <!-- 2 wires -->
  <line x1="755" y1="300" x2="795" y2="292" stroke="#e53935" stroke-width="1.2"/>
  <line x1="755" y1="300" x2="795" y2="308" stroke="#333" stroke-width="1.2"/>
  <text x="800" y="295" font-size="6" fill="#e53935">12V+</text>
  <text x="800" y="311" font-size="6" fill="#333">12V-</text>
  <!-- Label -->
  <rect x="740" y="270" width="140" height="20" rx="3" fill="white" stroke="#880e4f" stroke-width="0.8"/>
  <text x="810" y="283" text-anchor="middle" font-size="8" fill="#880e4f" font-weight="bold">6  SSR Trigger (K2 → SSR)</text>

  <!-- Cable gland 7: Junction box (fans + neutral + ground) -->
  <ellipse cx="650" cy="385" rx="5" ry="14" fill="#e65100" stroke="#bf360c" stroke-width="1.2"/>
  <line x1="650" y1="385" x2="755" y2="370" stroke="#e65100" stroke-width="5"/>
  <!-- 4 wires -->
  <line x1="755" y1="370" x2="800" y2="354" stroke="#e53935" stroke-width="1.2"/>
  <line x1="755" y1="370" x2="800" y2="364" stroke="#ff9800" stroke-width="1.2"/>
  <line x1="755" y1="370" x2="800" y2="374" stroke="white" stroke-width="1.2"/>
  <line x1="755" y1="370" x2="800" y2="384" stroke="#4caf50" stroke-width="1.2"/>
  <text x="808" y="358" font-size="6" fill="#e53935">FAN LO (K3 NO)</text>
  <text x="808" y="368" font-size="6" fill="#ff9800">FAN HI (K4 NO)</text>
  <text x="808" y="378" font-size="6" fill="#888">NEUTRAL (pass)</text>
  <text x="808" y="388" font-size="6" fill="#4caf50">GROUND (pass)</text>
  <!-- Label -->
  <rect x="740" y="330" width="140" height="20" rx="3" fill="white" stroke="#e65100" stroke-width="0.8"/>
  <text x="810" y="343" text-anchor="middle" font-size="8" fill="#bf360c" font-weight="bold">7  To Junction Box</text>

  <!-- ==================== -->
  <!-- DESTINATIONS (where cables go) -->
  <!-- ==================== -->

  <!-- Left side destination: OLED/BME280 board -->
  <rect x="15" y="400" width="110" height="45" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="70" y="416" text-anchor="middle" font-size="8" fill="#0d47a1" font-weight="bold">DISPLAY BOARD</text>
  <text x="70" y="428" text-anchor="middle" font-size="7" fill="#1565c0">SSD1306 OLED</text>
  <text x="70" y="438" text-anchor="middle" font-size="7" fill="#1565c0">BME280 Sensor</text>
  <line x1="70" y1="400" x2="70" y2="380" stroke="#1565c0" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- Left side destination: Evaporator -->
  <rect x="15" y="450" width="110" height="35" rx="5" fill="#e0f7fa" stroke="#00838f" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="70" y="466" text-anchor="middle" font-size="8" fill="#006064" font-weight="bold">EVAPORATOR COIL</text>
  <text x="70" y="478" text-anchor="middle" font-size="7" fill="#00838f">Waterproof probe</text>
  <line x1="70" y1="450" x2="70" y2="380" stroke="#00838f" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- Right side destination: Junction box -->
  <rect x="750" y="400" width="130" height="65" rx="5" fill="#fff3e0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="815" y="416" text-anchor="middle" font-size="8" fill="#bf360c" font-weight="bold">JUNCTION BOX</text>
  <text x="815" y="428" text-anchor="middle" font-size="7" fill="#e65100">SSR-25DA (compr)</text>
  <text x="815" y="440" text-anchor="middle" font-size="7" fill="#e65100">Supco SFPC</text>
  <text x="815" y="452" text-anchor="middle" font-size="7" fill="#e65100">Brisk II 6-pin</text>
  <text x="815" y="462" text-anchor="middle" font-size="7" fill="#c62828" font-weight="bold">120VAC</text>
  <line x1="815" y1="400" x2="815" y2="390" stroke="#e65100" stroke-width="0.7" stroke-dasharray="3,2"/>

  <!-- Right side destination: Furnace -->
  <rect x="750" y="472" width="130" height="35" rx="5" fill="#e3f2fd" stroke="#0d47a1" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="815" y="488" text-anchor="middle" font-size="8" fill="#0d47a1" font-weight="bold">FURNACE UNIT</text>
  <text x="815" y="500" text-anchor="middle" font-size="7" fill="#1565c0">Thermostat terminals</text>

  <!-- ==================== -->
  <!-- CABLE GLAND DETAIL -->
  <!-- ==================== -->
  <rect x="20" y="570" width="860" height="68" rx="4" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="35" y="588" font-size="10" font-weight="bold" fill="#333">Cable Entry Summary:</text>

  <!-- Table layout -->
  <text x="35" y="604" font-size="8" fill="#555" font-weight="bold">#</text>
  <text x="55" y="604" font-size="8" fill="#555" font-weight="bold">Side</text>
  <text x="105" y="604" font-size="8" fill="#555" font-weight="bold">Cable</text>
  <text x="290" y="604" font-size="8" fill="#555" font-weight="bold">Conductors</text>
  <text x="435" y="604" font-size="8" fill="#555" font-weight="bold">Gland Size</text>
  <text x="540" y="604" font-size="8" fill="#555" font-weight="bold">Voltage</text>
  <text x="630" y="604" font-size="8" fill="#555" font-weight="bold">Notes</text>
  <line x1="30" y1="607" x2="870" y2="607" stroke="#ddd" stroke-width="0.5"/>

  <text x="35" y="618" font-size="7" fill="#666">1</text>
  <text x="55" y="618" font-size="7" fill="#666">Left</text>
  <text x="105" y="618" font-size="7" fill="#666">USB-C</text>
  <text x="290" y="618" font-size="7" fill="#666">—</text>
  <text x="435" y="618" font-size="7" fill="#666">Panel mount USB-C</text>
  <text x="540" y="618" font-size="7" fill="#666">5V</text>
  <text x="630" y="618" font-size="7" fill="#666">Programming + power</text>

  <text x="35" y="628" font-size="7" fill="#666">2</text>
  <text x="55" y="628" font-size="7" fill="#1565c0">Left</text>
  <text x="105" y="628" font-size="7" fill="#1565c0">I2C to display board</text>
  <text x="290" y="628" font-size="7" fill="#666">4 (SDA, SCL, 3V3, GND)</text>
  <text x="435" y="628" font-size="7" fill="#666">PG7 (3-6mm)</text>
  <text x="540" y="628" font-size="7" fill="#666">3.3V</text>
  <text x="630" y="628" font-size="7" fill="#666">JST-XH 4-pin or Dupont</text>

  <text x="35" y="618" font-size="7" fill="#666">1   Left     USB-C                         —                              Panel mount USB-C        5V          Programming + power</text>
  <text x="35" y="628" font-size="7" fill="#666">2   Left     I2C display board             4 (SDA, SCL, 3V3, GND)         PG7 (3-6mm)              3.3V        JST-XH 4-pin connector</text>
  <text x="35" y="638" font-size="7" fill="#666">3   Left     DS18B20 probe                 3 (3V3, DATA, GND)             PG7 (3-6mm)              3.3V        Waterproof cable to coil</text>
  <text x="35" y="648" font-size="7" fill="#666">4   Bottom   12V DC power                  2 (V+, GND)                    PG9 (4-8mm)              12V DC      14 AWG from RV battery</text>
  <text x="35" y="658" font-size="7" fill="#666">5   Right    Furnace                       2 (NO, COM)                    PG7 (3-6mm)              Dry contact Low voltage thermostat wire</text>
  <text x="35" y="668" font-size="7" fill="#666">6   Right    SSR trigger                   2 (12V+, 12V-)                 PG7 (3-6mm)              12V DC      To SSR-25DA in junct box</text>
  <text x="35" y="678" font-size="7" fill="#666">7   Right    Junction box (fans)           4 (FanLo, FanHi, Neut, Gnd)    PG11 (5-10mm)            120VAC      14 AWG to Brisk II cable</text>
</svg>
