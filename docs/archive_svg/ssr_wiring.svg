<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 20px monospace; fill: #000; }
      .heading { font: bold 14px monospace; fill: #000; }
      .label { font: 12px monospace; fill: #000; }
      .warning { font: bold 12px monospace; fill: #ff0000; }
      .voltage-low { stroke: #0066cc; stroke-width: 2; fill: none; }
      .voltage-high { stroke: #ff0000; stroke-width: 3; fill: none; }
      .component { fill: #f0f0f0; stroke: #000; stroke-width: 2; }
      .ground { fill: none; stroke: #000; stroke-width: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="title" text-anchor="middle">SSR-25DA COMPRESSOR WIRING DIAGRAM</text>
  <text x="400" y="50" class="label" text-anchor="middle">ESP32 Remote → HL-52S Relay 2 → SSR-25DA → Compressor</text>

  <!-- ESP32 Remote Box -->
  <rect x="50" y="100" width="120" height="180" class="component"/>
  <text x="110" y="120" class="heading" text-anchor="middle">ESP32 Remote</text>
  <circle cx="150" cy="150" r="3" fill="#0066cc"/>
  <text x="160" y="155" class="label">GPIO 39</text>
  <circle cx="150" cy="180" r="3" fill="#000"/>
  <text x="160" y="185" class="label">GND</text>
  <circle cx="150" cy="210" r="3" fill="#cc0000"/>
  <text x="160" y="215" class="label">12V+</text>
  <circle cx="150" cy="240" r="3" fill="#000"/>
  <text x="160" y="245" class="label">GND</text>

  <!-- HL-52S Relay Module -->
  <rect x="250" y="100" width="140" height="180" class="component"/>
  <text x="320" y="120" class="heading" text-anchor="middle">HL-52S Relay 2</text>
  <text x="320" y="140" class="label" text-anchor="middle">(Active HIGH)</text>
  <circle cx="270" cy="170" r="3" fill="#0066cc"/>
  <text x="280" y="175" class="label">IN2 (Signal)</text>
  <circle cx="270" cy="200" r="3" fill="#000"/>
  <text x="280" y="205" class="label">GND</text>
  <circle cx="370" cy="170" r="3" fill="#cc0000"/>
  <text x="300" y="175" class="label" text-anchor="end">COM (12V)</text>
  <circle cx="370" cy="200" r="3" fill="#cc0000"/>
  <text x="300" y="205" class="label" text-anchor="end">NO</text>
  <circle cx="370" cy="230" r="3" fill="#888"/>
  <text x="300" y="235" class="label" text-anchor="end">NC (unused)</text>

  <!-- Wires: ESP32 to HL-52S -->
  <path d="M 150,150 L 270,170" class="voltage-low"/>
  <text x="200" y="155" class="label" fill="#0066cc">Control</text>
  <path d="M 150,180 L 270,200" class="voltage-low" stroke="#000"/>
  <path d="M 150,210 L 370,170" class="voltage-low" stroke="#cc0000"/>
  <text x="250" y="185" class="label" fill="#cc0000">12V+</text>

  <!-- SSR-25DA -->
  <rect x="480" y="100" width="140" height="180" class="component"/>
  <text x="550" y="120" class="heading" text-anchor="middle">SSR-25DA</text>
  <text x="550" y="140" class="label" text-anchor="middle">(Solid State Relay)</text>
  <text x="550" y="155" class="label" text-anchor="middle" fill="#666">3-32VDC → 25A/380VAC</text>
  <circle cx="500" cy="180" r="3" fill="#cc0000"/>
  <text x="510" y="185" class="label">DC+ (control)</text>
  <circle cx="500" cy="210" r="3" fill="#000"/>
  <text x="510" y="215" class="label">DC- (control)</text>
  <circle cx="600" cy="180" r="3" fill="#ff0000"/>
  <text x="540" y="185" class="label" text-anchor="end">AC1 (input)</text>
  <circle cx="600" cy="210" r="3" fill="#ff0000"/>
  <text x="540" y="215" class="label" text-anchor="end">AC2 (output)</text>

  <!-- Wires: HL-52S to SSR -->
  <path d="M 370,200 L 500,180" class="voltage-low" stroke="#cc0000"/>
  <text x="420" y="185" class="label" fill="#cc0000">12V trigger</text>
  <path d="M 150,240 L 240,340 L 500,210" class="voltage-low" stroke="#000"/>
  <text x="350" y="280" class="label">GND</text>

  <!-- 120VAC Source -->
  <rect x="680" y="100" width="100" height="80" class="component"/>
  <text x="730" y="120" class="heading" text-anchor="middle">120VAC</text>
  <text x="730" y="140" class="heading" text-anchor="middle">SOURCE</text>
  <circle cx="710" cy="160" r="3" fill="#ff0000"/>
  <text x="720" y="165" class="label">HOT</text>
  <circle cx="750" cy="160" r="3" fill="#0000ff"/>
  <text x="720" y="175" class="label">NEUTRAL</text>

  <!-- Wire: 120VAC HOT to SSR AC1 -->
  <path d="M 710,160 L 680,160 L 680,90 L 600,90 L 600,180" class="voltage-high"/>
  <text x="640" y="85" class="warning">⚠ 120VAC HOT</text>

  <!-- Compressor Load Chain -->
  <rect x="680" y="250" width="100" height="120" class="component"/>
  <text x="730" y="270" class="heading" text-anchor="middle">LOAD CHAIN</text>
  <circle cx="730" cy="290" r="3" fill="#ff0000"/>
  <text x="700" y="310" class="label" text-anchor="middle">Supco SFPC</text>
  <text x="700" y="325" class="label" text-anchor="middle" font-size="10">(freeze stat)</text>
  <circle cx="730" cy="340" r="3" fill="#ff0000"/>
  <text x="700" y="360" class="label" text-anchor="middle">Bimetal Cutout</text>

  <!-- Wire: SSR AC2 to Load Chain -->
  <path d="M 600,210 L 640,210 L 640,290 L 730,290" class="voltage-high"/>
  <text x="620" y="245" class="warning">⚠ 120VAC SWITCHED</text>

  <!-- Compressor -->
  <rect x="680" y="420" width="100" height="60" class="component"/>
  <text x="730" y="440" class="heading" text-anchor="middle">COMPRESSOR</text>
  <circle cx="730" cy="460" r="3" fill="#ff0000"/>
  <text x="700" y="475" class="label" text-anchor="middle">Pin 1 Blue</text>

  <!-- Wire: Load Chain to Compressor -->
  <path d="M 730,340 L 730,460" class="voltage-high"/>

  <!-- Wire: Compressor to NEUTRAL -->
  <path d="M 730,460 L 730,500 L 750,500 L 750,160" class="voltage-high" stroke="#0000ff"/>
  <text x="760" y="330" class="label" fill="#0000ff">NEUTRAL RETURN</text>

  <!-- Ground symbols -->
  <line x1="235" y1="340" x2="245" y2="340" class="ground"/>
  <line x1="230" y1="345" x2="250" y2="345" class="ground"/>
  <line x1="225" y1="350" x2="255" y2="350" class="ground"/>

  <!-- Safety Notes -->
  <rect x="50" y="320" width="380" height="260" fill="none" stroke="#ff0000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="240" y="345" class="warning" text-anchor="middle">⚠ SAFETY CRITICAL WIRING ⚠</text>

  <text x="60" y="370" class="label">KEY POINTS:</text>
  <text x="60" y="390" class="label">• HL-52S Relay 2 COM = 12VDC (NOT on 120VAC bus)</text>
  <text x="60" y="410" class="label">• Relay only switches milliamp trigger current to SSR</text>
  <text x="60" y="430" class="label">• SSR switches high-current 120VAC to compressor</text>
  <text x="60" y="450" class="label">• SSR needs heatsink (~15W @ 12A compressor load)</text>
  <text x="60" y="470" class="label">• Supco SFPC: NC contact, opens 35°F, closes 50°F</text>
  <text x="60" y="490" class="label">• Bimetal cutout: thermal overload protection</text>
  <text x="60" y="510" class="label">• All 120VAC wiring must be 14 AWG minimum</text>
  <text x="60" y="530" class="label">• Install in proper junction box per NEC</text>
  <text x="60" y="550" class="label">• Fan relays (GPIO 40-41) switch 120VAC directly</text>
  <text x="60" y="570" class="label">  via NO terminals (2-3A loads, within HL-52S rating)</text>
</svg>
