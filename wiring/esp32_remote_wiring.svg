<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1150" width="1300" height="1150">
  <defs>
    <style>
      .board { fill: #2a2a2a; stroke: #000; stroke-width: 2; }
      .pin { fill: #ffd700; stroke: #000; stroke-width: 1; }
      .sensor { fill: #27ae60; stroke: #000; stroke-width: 2; }
      .display { fill: #8e44ad; stroke: #000; stroke-width: 2; }
      .relay { fill: #e67e22; stroke: #000; stroke-width: 2; }
      .led { fill: #e74c3c; stroke: #000; stroke-width: 2; }

      .wire-power { stroke: #ff0000; stroke-width: 3; fill: none; }
      .wire-ground { stroke: #000000; stroke-width: 3; fill: none; }
      .wire-sda { stroke: #00ff00; stroke-width: 3; fill: none; }
      .wire-scl { stroke: #0000ff; stroke-width: 3; fill: none; }
      .wire-data { stroke: #ff00ff; stroke-width: 3; fill: none; }
      .wire-relay { stroke: #ffa500; stroke-width: 3; fill: none; }
      .wire-ir { stroke: #ff69b4; stroke-width: 3; fill: none; }

      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #fff; }
      .label-small { font-family: Arial, sans-serif; font-size: 11px; fill: #fff; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #fff; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #ccc; }
      .pin-label { font-family: monospace; font-size: 12px; fill: #ffd700; }
      .note { font-family: Arial, sans-serif; font-size: 12px; fill: #aaa; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1300" height="1150" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="650" y="40" class="title" text-anchor="middle">ESP32 REMOTE CONTROLLER</text>
  <text x="650" y="65" class="subtitle" text-anchor="middle">192.168.71.153 - HVAC Hardware Control</text>

  <!-- ESP32 Remote Board -->
  <rect x="550" y="150" width="200" height="500" class="board" rx="5"/>
  <text x="650" y="180" class="label" text-anchor="middle">ESP32 DevKit</text>
  <text x="650" y="197" class="label-small" text-anchor="middle">Remote Controller</text>

  <!-- ESP32 Pins - Left side, extending outward -->
  <!-- 3.3V -->
  <line x1="550" y1="240" x2="530" y2="240" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="240" r="4" class="pin"/>
  <text x="525" y="245" class="pin-label" text-anchor="end">3.3V</text>

  <!-- GND -->
  <line x1="550" y1="280" x2="530" y2="280" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="280" r="4" class="pin"/>
  <text x="525" y="285" class="pin-label" text-anchor="end">GND</text>

  <!-- GPIO 21 (SDA) -->
  <line x1="550" y1="340" x2="530" y2="340" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="340" r="4" class="pin"/>
  <text x="525" y="345" class="pin-label" text-anchor="end">GPIO 21 (SDA)</text>

  <!-- GPIO 22 (SCL) -->
  <line x1="550" y1="380" x2="530" y2="380" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="380" r="4" class="pin"/>
  <text x="525" y="385" class="pin-label" text-anchor="end">GPIO 22 (SCL)</text>

  <!-- GPIO 4 (DHT11) -->
  <line x1="550" y1="440" x2="530" y2="440" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="440" r="4" class="pin"/>
  <text x="525" y="445" class="pin-label" text-anchor="end">GPIO 4 (DHT11)</text>

  <!-- GPIO 25 (Relay 1) -->
  <line x1="550" y1="500" x2="530" y2="500" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="500" r="4" class="pin"/>
  <text x="525" y="505" class="pin-label" text-anchor="end">GPIO 25 (Relay)</text>

  <!-- GPIO 26 (Relay 2) -->
  <line x1="550" y1="540" x2="530" y2="540" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="540" r="4" class="pin"/>
  <text x="525" y="545" class="pin-label" text-anchor="end">GPIO 26 (Relay)</text>

  <!-- GPIO 18 (IR TX) -->
  <line x1="550" y1="590" x2="530" y2="590" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="590" r="4" class="pin"/>
  <text x="525" y="595" class="pin-label" text-anchor="end">GPIO 18 (IR TX)</text>

  <!-- GPIO 19 (IR RX) - Optional -->
  <line x1="550" y1="620" x2="530" y2="620" stroke="#ffd700" stroke-width="2"/>
  <circle cx="530" cy="620" r="4" class="pin"/>
  <text x="525" y="625" class="pin-label" text-anchor="end">GPIO 19 (IR RX)</text>

  <!-- BMP280 Sensor -->
  <rect x="50" y="720" width="200" height="150" class="sensor" rx="5"/>
  <text x="150" y="760" class="label" text-anchor="middle">BMP280</text>
  <text x="150" y="785" class="label-small" text-anchor="middle">Temperature</text>
  <text x="150" y="805" class="label-small" text-anchor="middle">Pressure</text>
  <text x="150" y="830" class="label-small" text-anchor="middle">I2C: 0x76</text>

  <!-- BMP280 Pins -->
  <line x1="250" y1="735" x2="270" y2="735" stroke="#ffd700" stroke-width="2"/>
  <circle cx="270" cy="735" r="4" class="pin"/>
  <text x="275" y="740" class="label-small">VCC</text>

  <line x1="250" y1="770" x2="270" y2="770" stroke="#ffd700" stroke-width="2"/>
  <circle cx="270" cy="770" r="4" class="pin"/>
  <text x="275" y="775" class="label-small">GND</text>

  <line x1="250" y1="805" x2="270" y2="805" stroke="#ffd700" stroke-width="2"/>
  <circle cx="270" cy="805" r="4" class="pin"/>
  <text x="275" y="810" class="label-small">SCL</text>

  <line x1="250" y1="840" x2="270" y2="840" stroke="#ffd700" stroke-width="2"/>
  <circle cx="270" cy="840" r="4" class="pin"/>
  <text x="275" y="845" class="label-small">SDA</text>

  <!-- DHT11 Sensor -->
  <rect x="300" y="720" width="200" height="150" class="sensor" rx="5"/>
  <text x="400" y="760" class="label" text-anchor="middle">DHT11</text>
  <text x="400" y="785" class="label-small" text-anchor="middle">Humidity</text>
  <text x="400" y="805" class="label-small" text-anchor="middle">Sensor</text>

  <!-- DHT11 Pins -->
  <line x1="500" y1="735" x2="520" y2="735" stroke="#ffd700" stroke-width="2"/>
  <circle cx="520" cy="735" r="4" class="pin"/>
  <text x="525" y="740" class="label-small">VCC</text>

  <line x1="500" y1="770" x2="520" y2="770" stroke="#ffd700" stroke-width="2"/>
  <circle cx="520" cy="770" r="4" class="pin"/>
  <text x="525" y="775" class="label-small">GND</text>

  <line x1="500" y1="805" x2="520" y2="805" stroke="#ffd700" stroke-width="2"/>
  <circle cx="520" cy="805" r="4" class="pin"/>
  <text x="525" y="810" class="label-small">DATA</text>

  <!-- OLED Display -->
  <rect x="800" y="720" width="200" height="150" class="display" rx="5"/>
  <text x="900" y="760" class="label" text-anchor="middle">OLED</text>
  <text x="900" y="785" class="label-small" text-anchor="middle">128x64</text>
  <text x="900" y="805" class="label-small" text-anchor="middle">SSD1306</text>
  <text x="900" y="830" class="label-small" text-anchor="middle">I2C: 0x3C</text>

  <!-- OLED Pins -->
  <line x1="800" y1="735" x2="780" y2="735" stroke="#ffd700" stroke-width="2"/>
  <circle cx="780" cy="735" r="4" class="pin"/>
  <text x="775" y="740" class="label-small" text-anchor="end">VCC</text>

  <line x1="800" y1="770" x2="780" y2="770" stroke="#ffd700" stroke-width="2"/>
  <circle cx="780" cy="770" r="4" class="pin"/>
  <text x="775" y="775" class="label-small" text-anchor="end">GND</text>

  <line x1="800" y1="805" x2="780" y2="805" stroke="#ffd700" stroke-width="2"/>
  <circle cx="780" cy="805" r="4" class="pin"/>
  <text x="775" y="810" class="label-small" text-anchor="end">SCL</text>

  <line x1="800" y1="840" x2="780" y2="840" stroke="#ffd700" stroke-width="2"/>
  <circle cx="780" cy="840" r="4" class="pin"/>
  <text x="775" y="845" class="label-small" text-anchor="end">SDA</text>

  <!-- 2-Channel Relay Module -->
  <rect x="1050" y="300" width="200" height="180" class="relay" rx="5"/>
  <text x="1150" y="340" class="label" text-anchor="middle">2-Channel Relay</text>
  <text x="1150" y="360" class="label-small" text-anchor="middle">Active-Low Module</text>

  <!-- Relay Pins -->
  <line x1="1050" y1="320" x2="1030" y2="320" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="320" r="4" class="pin"/>
  <text x="1025" y="325" class="label-small" text-anchor="end">VCC</text>

  <line x1="1050" y1="355" x2="1030" y2="355" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="355" r="4" class="pin"/>
  <text x="1025" y="360" class="label-small" text-anchor="end">GND</text>

  <line x1="1050" y1="410" x2="1030" y2="410" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="410" r="4" class="pin"/>
  <text x="1025" y="415" class="label-small" text-anchor="end">IN1</text>

  <line x1="1050" y1="450" x2="1030" y2="450" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="450" r="4" class="pin"/>
  <text x="1025" y="455" class="label-small" text-anchor="end">IN2</text>

  <!-- Relay Output Labels -->
  <text x="1150" y="420" class="label-small" text-anchor="middle">CH1 → Furnace</text>
  <text x="1150" y="460" class="label-small" text-anchor="middle">CH2 → Rooftop AC</text>

  <!-- IR LED -->
  <rect x="1050" y="540" width="200" height="100" class="led" rx="5"/>
  <text x="1150" y="580" class="label" text-anchor="middle">IR LED (38kHz)</text>
  <text x="1150" y="600" class="label-small" text-anchor="middle">Transmitter</text>

  <!-- IR LED Pins -->
  <line x1="1050" y1="560" x2="1030" y2="560" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="560" r="4" class="pin"/>
  <text x="1025" y="565" class="label-small" text-anchor="end">Signal</text>

  <line x1="1050" y1="600" x2="1030" y2="600" stroke="#ffd700" stroke-width="2"/>
  <circle cx="1030" cy="600" r="4" class="pin"/>
  <text x="1025" y="605" class="label-small" text-anchor="end">GND</text>

  <!-- Wiring - BMP280 (routes below ESP32) -->
  <path d="M 270 735 L 490 735 L 490 680 L 530 680 L 530 240" class="wire-power"/>
  <path d="M 270 770 L 480 770 L 480 690 L 520 690 L 520 280" class="wire-ground"/>
  <path d="M 270 805 L 470 805 L 470 700 L 510 700 L 510 380 L 530 380" class="wire-scl"/>
  <path d="M 270 840 L 460 840 L 460 710 L 500 710 L 500 340 L 530 340" class="wire-sda"/>

  <!-- Wiring - DHT11 -->
  <path d="M 520 735 L 540 735 L 540 680 L 530 680 L 530 240" class="wire-power"/>
  <path d="M 520 770 L 550 770 L 550 690 L 520 690 L 520 280" class="wire-ground"/>
  <path d="M 520 805 L 560 805 L 560 440 L 530 440" class="wire-data"/>

  <!-- Wiring - OLED (routes below ESP32) -->
  <path d="M 780 735 L 760 735 L 760 680 L 530 680 L 530 240" class="wire-power"/>
  <path d="M 780 770 L 770 770 L 770 690 L 520 690 L 520 280" class="wire-ground"/>
  <path d="M 780 805 L 750 805 L 750 700 L 570 700 L 570 380 L 530 380" class="wire-scl"/>
  <path d="M 780 840 L 740 840 L 740 710 L 580 710 L 580 340 L 530 340" class="wire-sda"/>

  <!-- Wiring - Relay Module -->
  <path d="M 1030 320 L 820 320 L 820 680 L 530 680 L 530 240" class="wire-power"/>
  <path d="M 1030 355 L 810 355 L 810 690 L 520 690 L 520 280" class="wire-ground"/>
  <path d="M 1030 410 L 800 410 L 800 500 L 530 500" class="wire-relay"/>
  <path d="M 1030 450 L 790 450 L 790 540 L 530 540" class="wire-relay"/>

  <!-- Wiring - IR LED -->
  <path d="M 1030 560 L 830 560 L 830 590 L 530 590" class="wire-ir"/>
  <path d="M 1030 600 L 840 600 L 840 690 L 520 690 L 520 280" class="wire-ground"/>

  <!-- Notes Section -->
  <text x="650" y="930" class="subtitle" text-anchor="middle">Hardware Notes</text>

  <text x="650" y="960" class="note" text-anchor="middle">• I2C bus shared between BMP280 and OLED (addresses: 0x76 and 0x3C)</text>
  <text x="650" y="980" class="note" text-anchor="middle">• Relay module is active-low: LOW signal turns relay ON, HIGH turns relay OFF</text>
  <text x="650" y="1000" class="note" text-anchor="middle">• IR Receiver on GPIO 19 is optional for learning remote codes</text>
  <text x="650" y="1020" class="note" text-anchor="middle">• BMP280 will be upgraded to BME280 (adds humidity, making DHT11 redundant)</text>

  <!-- Legend -->
  <text x="650" y="1070" class="subtitle" text-anchor="middle">Wire Color Guide</text>

  <line x1="150" y1="1095" x2="230" y2="1095" class="wire-power" stroke-width="4"/>
  <text x="235" y="1100" class="label-small">+3.3V (Red)</text>

  <line x1="350" y1="1095" x2="430" y2="1095" class="wire-ground" stroke-width="4"/>
  <text x="435" y="1100" class="label-small">GND (Black)</text>

  <line x1="550" y1="1095" x2="630" y2="1095" class="wire-sda" stroke-width="4"/>
  <text x="635" y="1100" class="label-small">SDA (Green)</text>

  <line x1="150" y1="1120" x2="230" y2="1120" class="wire-scl" stroke-width="4"/>
  <text x="235" y="1125" class="label-small">SCL (Blue)</text>

  <line x1="350" y1="1120" x2="430" y2="1120" class="wire-data" stroke-width="4"/>
  <text x="435" y="1125" class="label-small">Data (Magenta)</text>

  <line x1="550" y1="1120" x2="630" y2="1120" class="wire-relay" stroke-width="4"/>
  <text x="635" y="1125" class="label-small">Relay (Orange)</text>

  <line x1="750" y1="1095" x2="830" y2="1095" class="wire-ir" stroke-width="4"/>
  <text x="835" y="1100" class="label-small">IR (Pink)</text>
</svg>
