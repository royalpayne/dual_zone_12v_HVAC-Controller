<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .component { fill: #1a1a2e; stroke: #4a9eff; stroke-width: 2; }
      .label { font-family: Arial, sans-serif; font-size: 12px; fill: #fff; }
      .title { font-family: Arial, sans-serif; font-size: 14px; fill: #fff; font-weight: bold; }
      .pin { font-family: monospace; font-size: 11px; fill: #aaa; }
      .value { font-family: Arial, sans-serif; font-size: 11px; fill: #4CAF50; }
      .note { font-family: Arial, sans-serif; font-size: 10px; fill: #888; }
      .wire { stroke: #4a9eff; stroke-width: 2; fill: none; }
      .wire-pwr { stroke: #e74c3c; stroke-width: 2; fill: none; }
      .wire-gnd { stroke: #555; stroke-width: 2; fill: none; }
      .wire-sig { stroke: #9b59b6; stroke-width: 2; fill: none; }
    </style>
    
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#0d1117"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff" font-weight="bold">IR LED Transistor Driver Circuit</text>
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="12" fill="#888">Using 2N2222 NPN Transistor from Elegoo Kit</text>
  
  <!-- Main Circuit Area -->
  <rect x="50" y="80" width="450" height="400" rx="10" fill="#111" stroke="#333"/>
  <text x="275" y="105" text-anchor="middle" class="title">Circuit Schematic</text>
  
  <!-- 3.3V Power Rail -->
  <line x1="100" y1="140" x2="400" y2="140" class="wire-pwr" stroke-width="3"/>
  <text x="90" y="144" class="pin" text-anchor="end" fill="#e74c3c">3.3V</text>
  <circle cx="100" cy="140" r="5" fill="#e74c3c"/>
  
  <!-- Ground Rail -->
  <line x1="100" y1="440" x2="400" y2="440" class="wire-gnd" stroke-width="3"/>
  <text x="90" y="444" class="pin" text-anchor="end" fill="#555">GND</text>
  <circle cx="100" cy="440" r="5" fill="#555"/>
  
  <!-- IR LED Symbol -->
  <g transform="translate(300, 180)">
    <!-- LED Triangle -->
    <polygon points="0,0 0,50 30,25" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <!-- LED Bar (cathode) -->
    <line x1="30" y1="0" x2="30" y2="50" stroke="#9b59b6" stroke-width="2"/>
    <!-- Arrows (light emission) -->
    <line x1="35" y1="10" x2="50" y2="0" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="35" y1="20" x2="50" y2="10" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <!-- Labels -->
    <text x="15" y="-10" text-anchor="middle" class="title" fill="#9b59b6">IR LED</text>
    <text x="-15" y="25" class="pin" text-anchor="end">Anode (+)</text>
    <text x="50" y="25" class="pin">Cathode (-)</text>
  </g>
  
  <!-- Wire from 3.3V to LED Anode -->
  <line x1="300" y1="140" x2="300" y2="180" class="wire-pwr"/>
  <circle cx="300" cy="140" r="4" fill="#e74c3c"/>
  
  <!-- Current Limiting Resistor between LED and Transistor -->
  <g transform="translate(315, 260)">
    <rect x="0" y="0" width="15" height="50" fill="none" stroke="#f39c12" stroke-width="2"/>
    <text x="30" y="30" class="value">100Ω</text>
    <text x="30" y="45" class="note">(optional)</text>
  </g>
  
  <!-- Wire from LED cathode to resistor -->
  <line x1="330" y1="230" x2="322" y2="230" class="wire"/>
  <line x1="322" y1="230" x2="322" y2="260" class="wire"/>
  
  <!-- 2N2222 Transistor -->
  <g transform="translate(280, 330)">
    <!-- Transistor circle -->
    <circle cx="40" cy="40" r="35" fill="none" stroke="#2ecc71" stroke-width="2"/>
    
    <!-- Base line -->
    <line x1="0" y1="40" x2="20" y2="40" stroke="#2ecc71" stroke-width="2"/>
    <!-- Emitter bar -->
    <line x1="20" y1="20" x2="20" y2="60" stroke="#2ecc71" stroke-width="2"/>
    
    <!-- Collector line -->
    <line x1="20" y1="25" x2="55" y2="5" stroke="#2ecc71" stroke-width="2"/>
    <!-- Emitter line with arrow -->
    <line x1="20" y1="55" x2="55" y2="75" stroke="#2ecc71" stroke-width="2"/>
    <polygon points="48,68 55,75 45,73" fill="#2ecc71"/>
    
    <!-- Labels -->
    <text x="40" y="-5" text-anchor="middle" class="title" fill="#2ecc71">2N2222</text>
    <text x="-5" y="35" class="pin" text-anchor="end">B</text>
    <text x="62" y="5" class="pin">C</text>
    <text x="62" y="80" class="pin">E</text>
  </g>
  
  <!-- Wire from resistor to collector -->
  <line x1="322" y1="310" x2="322" y2="325" class="wire"/>
  <line x1="322" y1="325" x2="335" y2="335" class="wire"/>
  
  <!-- Wire from emitter to ground -->
  <line x1="335" y1="405" x2="335" y2="440" class="wire-gnd"/>
  <circle cx="335" cy="440" r="4" fill="#555"/>
  
  <!-- Base Resistor -->
  <g transform="translate(180, 355)">
    <rect x="0" y="0" width="50" height="15" fill="none" stroke="#f39c12" stroke-width="2"/>
    <text x="25" y="35" text-anchor="middle" class="value">1kΩ</text>
  </g>
  
  <!-- Wire from base resistor to transistor base -->
  <line x1="230" y1="362" x2="280" y2="370" class="wire"/>
  
  <!-- GP18 Input -->
  <rect x="80" y="350" width="60" height="30" rx="5" fill="#1a472a" stroke="#4CAF50" stroke-width="2"/>
  <text x="110" y="370" text-anchor="middle" class="pin" fill="#4CAF50">GP18</text>
  
  <!-- Wire from GP18 to base resistor -->
  <line x1="140" y1="365" x2="180" y2="362" class="wire-sig"/>
  
  <!-- Pico indicator -->
  <text x="110" y="340" text-anchor="middle" class="note">From Pico</text>
  
  
  <!-- ==================== -->
  <!-- Component Details Panel -->
  <!-- ==================== -->
  <rect x="520" y="80" width="260" height="220" rx="10" fill="#1a1a2e" stroke="#4a9eff"/>
  <text x="650" y="105" text-anchor="middle" class="title">Components from Elegoo Kit</text>
  
  <!-- 2N2222 -->
  <g transform="translate(540, 120)">
    <rect x="0" y="0" width="80" height="35" rx="5" fill="#222" stroke="#2ecc71"/>
    <text x="40" y="15" text-anchor="middle" class="pin" fill="#2ecc71">2N2222</text>
    <text x="40" y="28" text-anchor="middle" class="note">NPN Transistor</text>
  </g>
  <text x="640" y="140" class="label">• Flat side faces you</text>
  <text x="640" y="155" class="label">• Pins: E-B-C (left to right)</text>
  
  <!-- IR LED -->
  <g transform="translate(540, 170)">
    <ellipse cx="15" cy="17" rx="8" ry="17" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <line x1="10" y1="34" x2="10" y2="45" stroke="#9b59b6" stroke-width="2"/>
    <line x1="20" y1="34" x2="20" y2="45" stroke="#9b59b6" stroke-width="2"/>
    <text x="50" y="15" class="pin" fill="#9b59b6">IR LED</text>
    <text x="50" y="30" class="note">Clear or dark purple</text>
  </g>
  <text x="640" y="200" class="label">• Long leg = Anode (+)</text>
  <text x="640" y="215" class="label">• Short leg = Cathode (-)</text>
  
  <!-- Resistors -->
  <g transform="translate(540, 230)">
    <rect x="0" y="5" width="30" height="10" fill="none" stroke="#f39c12" stroke-width="2"/>
    <text x="50" y="15" class="pin" fill="#f39c12">Resistors</text>
  </g>
  <text x="640" y="250" class="label">• 1kΩ (brown-black-red)</text>
  <text x="640" y="265" class="label">• 100Ω optional (brown-black-brown)</text>
  
  
  <!-- ==================== -->
  <!-- Transistor Pinout Detail -->
  <!-- ==================== -->
  <rect x="520" y="310" width="260" height="130" rx="10" fill="#1a1a2e" stroke="#2ecc71"/>
  <text x="650" y="335" text-anchor="middle" class="title">2N2222 Pinout (Bottom View)</text>
  
  <g transform="translate(570, 355)">
    <!-- Transistor body -->
    <path d="M 30,0 A 30,30 0 1,1 30,60 L 30,0" fill="#222" stroke="#2ecc71" stroke-width="2"/>
    
    <!-- Flat side indicator -->
    <line x1="30" y1="0" x2="30" y2="60" stroke="#2ecc71" stroke-width="3"/>
    <text x="45" y="35" class="note" fill="#2ecc71">FLAT</text>
    
    <!-- Pins -->
    <circle cx="5" cy="50" r="5" fill="#2ecc71"/>
    <circle cx="15" cy="55" r="5" fill="#9b59b6"/>
    <circle cx="25" cy="50" r="5" fill="#e74c3c"/>
    
    <!-- Pin labels -->
    <text x="5" y="75" text-anchor="middle" class="pin" fill="#2ecc71">E</text>
    <text x="15" y="80" text-anchor="middle" class="pin" fill="#9b59b6">B</text>
    <text x="25" y="75" text-anchor="middle" class="pin" fill="#e74c3c">C</text>
  </g>
  
  <g transform="translate(660, 360)">
    <text x="0" y="15" class="label" fill="#2ecc71">E = Emitter → GND</text>
    <text x="0" y="35" class="label" fill="#9b59b6">B = Base → GP18 (via 1kΩ)</text>
    <text x="0" y="55" class="label" fill="#e74c3c">C = Collector → LED cathode</text>
  </g>
  
  
  <!-- ==================== -->
  <!-- Step by Step Wiring -->
  <!-- ==================== -->
  <rect x="520" y="450" width="260" height="130" rx="10" fill="#111" stroke="#f39c12"/>
  <text x="650" y="475" text-anchor="middle" class="title" fill="#f39c12">Wiring Steps</text>
  
  <text x="535" y="495" class="label">1. IR LED anode (long) → 3.3V</text>
  <text x="535" y="515" class="label">2. IR LED cathode (short) → Collector</text>
  <text x="535" y="535" class="label">3. Emitter → GND</text>
  <text x="535" y="555" class="label">4. Base → 1kΩ resistor → GP18</text>
  <text x="535" y="575" class="label">5. (Optional) 100Ω between LED & collector</text>
  
  
  <!-- ==================== -->
  <!-- Current Flow Arrows -->
  <!-- ==================== -->
  <text x="275" y="500" text-anchor="middle" class="title">How It Works</text>
  
  <text x="100" y="520" class="note">When GP18 goes HIGH (3.3V):</text>
  <text x="100" y="535" class="note">• Small current flows into Base</text>
  <text x="100" y="550" class="note">• Transistor turns ON</text>
  <text x="100" y="565" class="note">• Large current flows through LED</text>
  <text x="100" y="580" class="note">• IR light is emitted!</text>
  
  <text x="300" y="520" class="note">The transistor amplifies the Pico's</text>
  <text x="300" y="535" class="note">weak signal (~12mA max) to drive</text>
  <text x="300" y="550" class="note">the LED at ~30-50mA for better range.</text>
  
</svg>
